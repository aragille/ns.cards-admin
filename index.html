<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NS.Cards Admin</title>
<!--
  NS.Cards Admin: clickable prototype
  ─────────────────────────────────────
  • Design tokens       → :root (light) and :root[data-theme="dark"] in <style>
  • Logo / favicon      → SIGN_D / WORD_D in <script>
  • Navigation          → NAV
  • Mock data           → genUsers(), dashData()
  • Users stat widgets  → STAT_TILES
  • Users table columns → COLS
  • Filter fields       → FIELDS
  Routes: #/dashboard, #/users, #/users/<id> (other nav items show a placeholder)
  Shortcuts: ⌘K command menu · ⌘B / [ toggle sidebar · "/" focus search · j / k next/prev user · Esc back/close
-->
<script>
  try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('nsc.theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="icon" id="favicon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── Tokens ───────────────────────── */
:root{
  color-scheme:light;
  --brand:#FC7C1A; --brand-600:#EC6A0B; --brand-700:#FC7C1A; --brand-50:#FFF5EC; --brand-100:#FFE8D5; --brand-200:#FFDDBF;

  --bg:#FAFAF9; --surface:#FFFFFF; --surface-2:#F5F5F4; --hover:#F4F4F2; --row-hover:#FBFBFA; --head-bg:#FCFCFB;
  --line:#EDEDEB; --line-soft:#F3F3F1; --line-strong:#E3E3E0; --cb-border:#CFCFCB; --scroll:#E4E4E1; --scroll-hover:#CFCFCB;

  --ink:#111111; --ink-2:#6B6B6B; --ink-3:#A0A09C; --nav-ink:#3D3D3B;
  --inv:#111111; --on-inv:#FFFFFF; --inv-hover:#2A2A2A;      /* inverted controls (dark buttons, checked boxes) */
  --float:#111111;                                           /* tooltip, toast, bulk bar */
  --asset-eur:#111111;

  --success:#7AB317; --success-bg:#F1F8E4; --success-ink:#4A7A09;
  --warning:#FC7C1A; --warning-bg:#FFF3E8; --warning-ink:#C2560A;
  --error:#EF3434;   --error-bg:#FDEDED;   --error-ink:#C42222;
  --info:#3BA7F5;    --info-bg:#EAF5FE;    --info-ink:#1B76BA;
  --feature:#B44AF5; --feature-bg:#F6EDFE; --feature-ink:#8A2BC8;
  --neutral:#B5B5B1; --neutral-bg:#F2F2F0; --neutral-ink:#5E5E5B;

  /* categorical chart palette (validated per theme: CVD + normal-vision separation) */
  --c1:#F57314; --c2:#2F6FE0; --c3:#0E9F9A; --c4:#A044E8; --c5:#D6336C;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px; --pill:999px;
  --shadow-sm:0 1px 2px rgba(17,17,17,.04);
  --shadow:0 1px 2px rgba(17,17,17,.04),0 6px 20px rgba(17,17,17,.04);
  --shadow-pop:0 12px 32px rgba(17,17,17,.12),0 2px 6px rgba(17,17,17,.06);

  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:var(--font);  /* single typeface: numbers rely on tabular figures (tnum) */
  --sidebar:248px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand-600:#FF8A33; --brand-700:#FC7C1A; --brand-50:rgba(252,124,26,.10); --brand-100:rgba(252,124,26,.18); --brand-200:rgba(252,124,26,.28);

  --bg:#0E0E0F; --surface:#161618; --surface-2:#1D1D20; --hover:#222226; --row-hover:#1A1A1D; --head-bg:#19191C;
  --line:#26262A; --line-soft:#1F1F23; --line-strong:#323237; --cb-border:#4A4A50; --scroll:#2E2E33; --scroll-hover:#3E3E44;

  --ink:#F2F2F0; --ink-2:#A3A3A0; --ink-3:#6E6E6B; --nav-ink:#C9C9C6;
  --inv:#F2F2F0; --on-inv:#111111; --inv-hover:#FFFFFF;
  --float:#2A2A2F;
  --asset-eur:#3A3A40;

  --success:#8CC63F; --success-bg:rgba(140,198,63,.14); --success-ink:#A9D86A;
  --warning:#FC7C1A; --warning-bg:rgba(252,124,26,.15); --warning-ink:#FFA05A;
  --error:#F05252;   --error-bg:rgba(240,82,82,.15);   --error-ink:#FF8F8F;
  --info:#4BB0F7;    --info-bg:rgba(75,176,247,.14);   --info-ink:#7CC6FA;
  --feature:#C07BF7; --feature-bg:rgba(192,123,247,.15); --feature-ink:#D3A2FA;
  --neutral:#6E6E6B; --neutral-bg:#232327; --neutral-ink:#B0B0AC;

  --c1:#E06210; --c2:#3F7BEA; --c3:#0E9F9A; --c4:#A651EC; --c5:#DB3F75;

  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --shadow-pop:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
}

/* ───────────────────────── Base ───────────────────────── */
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--scroll-hover)}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","tnum"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.i{flex:none;display:block}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.r{text-align:right}
::selection{background:var(--brand-100)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ───────────────────────── Shell ───────────────────────── */
/* Sidebar animates its own width; icons sit at fixed x so nothing jumps, labels only fade. */
.app{display:grid;grid-template-columns:auto minmax(0,1fr);height:100vh}
.sidebar{width:248px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:20;transition:width .24s cubic-bezier(.2,.8,.2,1)}
.app.collapsed .sidebar{width:68px}
.fade{transition:opacity .16s ease}
.app.collapsed .fade{opacity:0;pointer-events:none}
.sb-head{position:relative;height:72px;display:flex;align-items:center;padding:0 21px;flex:none}
.logo{display:flex;align-items:center;gap:7.5px;color:var(--ink);transition:opacity .15s}
.sb-toggle{position:absolute;right:14px;top:20px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);transition:opacity .15s,right .24s cubic-bezier(.2,.8,.2,1)}
.sb-toggle:hover{background:var(--hover);color:var(--ink)}
.app.collapsed .sb-toggle{right:17px;opacity:0;pointer-events:none}
.app.collapsed .sb-head:hover .sb-toggle{opacity:1;pointer-events:auto}
.app.collapsed .sb-head:hover .logo{opacity:0}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 12px 12px}
.sb-label{display:flex;align-items:center;justify-content:space-between;width:100%;font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);padding:18px 13px 6px;white-space:nowrap}
.sb-label .i{opacity:0;transition:opacity .12s,transform .15s}
/* collapsed: section titles fold away (height animates with the width) so every page icon is evenly spaced */
.sb-label{max-height:44px;overflow:hidden;transition:opacity .16s ease,max-height .24s cubic-bezier(.2,.8,.2,1),padding .24s cubic-bezier(.2,.8,.2,1)}
.app.collapsed .sb-label{max-height:0;padding-top:0;padding-bottom:0}
.sb-label:hover{color:var(--ink-2)} .sb-label:hover .i{opacity:1}
.sb-group.closed .sb-label .i{transform:rotate(-90deg);opacity:1}
.sb-group.closed .sb-items{display:none}
.app.collapsed .sb-group.closed .sb-items{display:block}
.nav{display:flex;align-items:center;gap:11px;height:36px;padding:0 13px;border-radius:10px;color:var(--nav-ink);font-weight:500;width:100%;white-space:nowrap;overflow:hidden;transition:background .12s}
.nav:hover{background:var(--hover)}
.nav .i{color:var(--ink-3)}
.nav.active{background:var(--brand-50);color:var(--brand)}
.nav.active .i{color:var(--brand)}
.nav .nb{margin-left:auto;font-family:var(--mono);font-size:11px;font-style:normal;color:var(--brand-700);background:var(--brand-100);padding:1px 6px;border-radius:6px}
.sb-foot{padding:10px 12px;border-top:1px solid var(--line);flex:none}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;width:100%;white-space:nowrap;overflow:hidden}
.me:hover{background:var(--hover)}
.me .em{font-size:13px;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.me-av{width:28px;height:28px;border-radius:50%;background:var(--inv);color:var(--on-inv);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.me-h{display:flex;align-items:center;gap:10px;padding:8px 10px 6px}
.me-h .me-n{font-weight:500;font-size:13.5px}
.me-h .me-e{font-size:12px;color:var(--ink-3)}

.main-wrap{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:72px;flex:none;display:flex;align-items:center;gap:8px;padding:0 20px 0 28px;border-bottom:1px solid var(--line);background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:10px;font-size:17px;letter-spacing:-.01em;flex:0 1 auto;overflow:hidden;padding:4px 8px;margin:0 -8px;color:var(--ink-2);min-width:0;white-space:nowrap}
.crumbs a{padding:5px 7px;margin:0 -7px;border-radius:8px}
.crumbs a:hover{background:var(--hover);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb-sep{color:var(--line-strong)}
.tb-ctx{display:flex;align-items:center;gap:8px}
.crumbs .count{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-left:-2px}
.topbar .vsep{margin:0 4px}
kbd{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;line-height:18px}
.tb-sp{flex:1}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);position:relative;flex:none}
.icon-btn:hover:not(:disabled){background:var(--hover)}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}
.icon-btn.bare{border-color:transparent;background:transparent}
.icon-btn .dotn{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.menu-btn{display:none}
main{flex:1;overflow:auto;min-height:0}
.keys{display:flex;flex-direction:column}
.keys>div{display:flex;align-items:center;justify-content:space-between;height:40px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.keys>div:last-child{border-bottom:0}
.keys span:last-child{display:flex;gap:4px}

/* Framed page with hairlines */
.page{max-width:1480px;margin:0 auto;min-height:100%;background:var(--bg)}
.band{position:relative;border-bottom:1px solid var(--line)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:30px 28px 20px;flex-wrap:wrap}
h1{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:0;display:flex;align-items:baseline;gap:10px}
h1 .count{font-family:var(--mono);font-size:14px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.ph-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vsep{width:1px;height:22px;background:var(--line-strong);margin:0 2px}

/* ───────────────────────── Controls ───────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 15px;border-radius:var(--pill);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,box-shadow .12s,border-color .12s}
.btn-primary{background:var(--brand);color:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12),0 1px 3px rgba(252,124,26,.35)}
.btn-primary:hover{background:var(--brand-600)}
.btn-dark{background:var(--inv);color:var(--on-inv)}
.btn-dark:hover{background:var(--inv-hover)}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong)}
.btn-ghost:hover{background:var(--hover)}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.btn-danger{color:var(--error-ink)}
.link-btn{font-size:13px;color:var(--ink-2);font-weight:500;padding:0 6px;height:30px}
.link-btn:hover{color:var(--ink)}
.ghost-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.ghost-ic:hover{background:var(--hover);color:var(--ink)}

.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{height:28px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(17,17,17,.08),0 0 0 1px var(--line)}
.seg.sm button{height:24px;padding:0 9px;font-size:12.5px}

.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--pill);font-size:12px;font-weight:500;white-space:nowrap}
.badge .dot{width:6px;height:6px}
.t-success{--tone:var(--success);--tone-bg:var(--success-bg);--tone-ink:var(--success-ink)}
.t-warning{--tone:var(--warning);--tone-bg:var(--warning-bg);--tone-ink:var(--warning-ink)}
.t-error{--tone:var(--error);--tone-bg:var(--error-bg);--tone-ink:var(--error-ink)}
.t-info{--tone:var(--info);--tone-bg:var(--info-bg);--tone-ink:var(--info-ink)}
.t-feature{--tone:var(--feature);--tone-bg:var(--feature-bg);--tone-ink:var(--feature-ink)}
.t-neutral{--tone:var(--neutral);--tone-bg:var(--neutral-bg);--tone-ink:var(--neutral-ink)}
.badge{background:var(--tone-bg);color:var(--tone-ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tone);flex:none}
.stat{display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.risk{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.flag{font-size:15px;line-height:1}
.ctry{display:inline-flex;align-items:center;gap:7px}

.cb{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--cb-border);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--on-inv);transition:all .1s}
.cb .i{opacity:0}
.cb.on{background:var(--inv);border-color:var(--inv)} .cb.on .i{opacity:1}
.cb.mixed{background:var(--inv);border-color:var(--inv)}
.cb.mixed::after{content:"";width:8px;height:1.75px;background:var(--on-inv);border-radius:2px}
.rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--cb-border);flex:none}
.rd.on{border:5px solid var(--inv)}

.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;letter-spacing:-.02em}
.av-0{background:#FFE8D6;color:#B4530A}.av-1{background:#E3EEFF;color:#2556B8}.av-2{background:#DDF5F3;color:#0B7A76}.av-3{background:#F1E6FD;color:#7A33B8}.av-4{background:#FDE4EC;color:#B02457}.av-5{background:#EEF6DD;color:#4B7A08}.av-6{background:#F0F0EE;color:#555}
[data-theme="dark"] .av-0{background:rgba(252,124,26,.16);color:#FFA45E}[data-theme="dark"] .av-1{background:rgba(63,123,234,.18);color:#8EB4FA}[data-theme="dark"] .av-2{background:rgba(14,159,154,.18);color:#5ED4CE}[data-theme="dark"] .av-3{background:rgba(166,81,236,.18);color:#C99AF5}[data-theme="dark"] .av-4{background:rgba(219,63,117,.18);color:#F28DB0}[data-theme="dark"] .av-5{background:rgba(122,179,23,.16);color:#A9D86A}[data-theme="dark"] .av-6{background:#26262A;color:#B0B0AC}

/* ───────────────────────── Users list ───────────────────────── */
.ustats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:20px 28px 0}
.ust{padding:12px 14px 11px;text-align:left;min-width:0;background:transparent;border:1px solid var(--line-strong);border-radius:12px;transition:background .12s,transform .08s}
.ust:hover{background:var(--hover)}
.ust:active{transform:scale(.985)}
.ust.on,.ust.on:hover{background:var(--surface)}
.ust-l{display:flex;align-items:center;gap:6px;font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.ust.on .ust-l{color:var(--ink-2)}
.ust-v{display:flex;align-items:baseline;gap:8px;margin-top:6px;white-space:nowrap}
.ust-v b{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ust-v span{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}

.toolbar{display:flex;align-items:center;gap:8px;padding:14px 28px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 11px;width:300px;border-radius:10px;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-3);transition:border-color .12s,box-shadow .12s}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink);font-size:13.5px}
.search input::placeholder{color:var(--ink-3)}
.tool-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:10px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink-2);font-weight:500;font-size:13px}
.tool-btn:hover{background:var(--surface);color:var(--ink);border-style:solid}
.tool-btn.solid{height:36px;border-style:solid;background:var(--surface);color:var(--ink)}
.tool-btn.solid:hover{background:var(--hover)}
.chips{display:contents}
.chip{display:inline-flex;align-items:stretch;height:34px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:13px;overflow:hidden;animation:pop-in .14s ease}
.chip>*{display:flex;align-items:center;gap:6px;padding:0 9px;white-space:nowrap}
.chip .cf{color:var(--ink-2)}
.chip .cf .i{color:var(--ink-3)}
.chip .co{color:var(--ink-3);padding:0 2px 0 0}
.chip .cv{font-weight:500;border-left:1px solid var(--line);margin-left:7px}
.chip .cv:hover,.chip .cx:hover{background:var(--hover)}
.chip .cx{border-left:1px solid var(--line);color:var(--ink-3);padding:0 8px}
@keyframes pop-in{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

.results{padding:0 28px 28px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.tscroll{overflow:auto;max-height:calc(100vh - 278px);min-height:280px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1040px}
th{position:sticky;top:0;z-index:2;background:var(--head-bg);text-align:left;font-weight:500;font-size:12.5px;color:var(--ink-2);height:40px;padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
.th-in{display:inline-flex;align-items:center;gap:4px}
th.r .th-in{flex-direction:row-reverse}
th .srt{opacity:0;transition:opacity .1s}
th.sortable:hover .srt{opacity:.45}
th.sorted{color:var(--ink)} th.sorted .srt{opacity:1}
td{height:54px;padding:0 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;font-size:13.5px}
.compact td{height:40px}
.compact .ucell .ue{display:none}
.compact .ucell .av{width:24px!important;height:24px!important;font-size:10px!important}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--row-hover)}
tbody tr.sel td{background:var(--brand-50)}
tbody tr:last-child td{border-bottom:0}
th.cbcell,td.cbcell{width:44px;padding:0 4px 0 18px}
th.act-h,td.act{width:84px}
.row-actions{display:flex;justify-content:flex-end;gap:2px;opacity:0;transition:opacity .1s}
tr:hover .row-actions{opacity:1}
.ucell{display:flex;align-items:center;gap:10px;min-width:0}
.ucell .un{font-weight:500;line-height:1.25}
.ucell .ue{color:var(--ink-2);font-size:12.5px;line-height:1.3}
.copy{display:inline-flex;align-items:center;gap:6px;padding:3px 6px;margin:0 -6px;border-radius:6px;color:var(--ink)}
.copy .i{opacity:0;color:var(--ink-3)}
.copy:hover{background:var(--hover)} .copy:hover .i{opacity:1}
.num{font-family:var(--mono);font-size:13px}
.zero{color:var(--ink-3)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;padding:0 12px 0 18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.pager .pp,.pager .pg{display:flex;align-items:center;gap:6px}
.pg .pn{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pg .pn:hover{background:var(--hover);color:var(--ink)}
.pg .pn.on{background:var(--inv);color:var(--on-inv)}
.mini-sel{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12.5px;color:var(--ink)}

.empty{padding:72px 20px;text-align:center;color:var(--ink-2)}
.empty .em-ic{width:48px;height:48px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink-3)}
.empty h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--ink)}
.empty p{margin:0 0 16px;font-size:13px}

/* list view */
.lg-h{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 18px;background:var(--head-bg);border-bottom:1px solid var(--line);font-weight:500;position:sticky;top:0;z-index:1}
.lg-h>.i{color:var(--ink-3);transition:transform .15s}
.lg.collapsed .lg-h>.i{transform:rotate(-90deg)}
.lg.collapsed .lg-b{display:none}
.lrow{display:flex;align-items:center;gap:12px;padding:0 18px;height:58px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.compact .lrow{height:44px}
.lrow:hover{background:var(--row-hover)}
.lrow.sel{background:var(--brand-50)}
.lmain{flex:1;min-width:0}
.lname{font-weight:500;display:flex;align-items:center;gap:8px}
.lsub{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compact .lsub{display:none}
.lmeta{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--ink-2)}
.lmeta>*{white-space:nowrap}
.lmeta .bal{width:96px;text-align:right;color:var(--ink)}
.lmeta .when{width:70px;text-align:right}
.more-row{display:block;width:100%;height:42px;color:var(--ink-2);font-size:13px;font-weight:500;border-bottom:1px solid var(--line-soft)}
.more-row:hover{background:var(--row-hover);color:var(--ink)}

/* board view */
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
.col{flex:0 0 290px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 248px);transition:background .12s,border-color .12s}
.col.over{background:var(--brand-50);border-color:var(--brand)}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;font-weight:600;font-size:13.5px}
.col-h .mono{font-weight:400;color:var(--ink-3)}
.col-b{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm);cursor:grab;transition:box-shadow .12s,transform .12s,border-color .12s}
.bcard:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.bcard.dragging{opacity:.45;transform:rotate(1.5deg)}
.bc-top{display:flex;align-items:center;gap:8px}
.bc-name{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-email{font-size:12.5px;color:var(--ink-2);margin:6px 0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);background:var(--surface)}
.bc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.col-empty{border:1.5px dashed var(--line-strong);border-radius:12px;height:72px;display:grid;place-items:center;color:var(--ink-3);font-size:12.5px}
.more-btn{height:34px;border-radius:10px;color:var(--ink-2);font-size:12.5px;font-weight:500}
.more-btn:hover{background:var(--surface)}

/* floating bar (bulk actions + unsaved changes) */
.bulk{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);opacity:0;z-index:40;display:flex;align-items:center;gap:2px;padding:6px;background:var(--float);color:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none}
.bulk.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.bulk .bk-n{padding:0 10px 0 12px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.bulk .bk-n b{font-family:var(--mono);font-weight:500;background:rgba(255,255,255,.12);border-radius:6px;padding:1px 6px}
.bulk .sep{width:1px;height:20px;background:rgba(255,255,255,.14);margin:0 4px}
.bulk button{height:32px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;color:rgba(255,255,255,.92)}
.bulk button:hover{background:rgba(255,255,255,.1)}
.bulk .bk-danger{color:#FF8A8A}
.bulk .bk-x{width:32px;padding:0;justify-content:center}
.bulk .bk-link{color:#FFA45E}
.bulk .bk-save{background:var(--brand);color:#fff}
.bulk .bk-save:hover{background:var(--brand-600)}

/* ───────────────────────── User page ───────────────────────── */
.up-head{align-items:center}
.up-id{display:flex;align-items:center;gap:16px;min-width:0}
.up-sub{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;margin-top:6px;flex-wrap:wrap}
.up-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;align-items:center;gap:4px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;height:46px;padding:0 10px;display:flex;align-items:center;gap:7px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.up-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:24px 28px 96px;align-items:start}
.up-main,.up-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card .kv-r:last-child{border-bottom:0}
.kv-r{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.kv-r>span:first-child{color:var(--ink-2)}
.kv-r b{font-weight:500}
.kv2{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.kv2 .kv-r:nth-last-child(2):nth-child(odd){border-bottom:0}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;font-weight:500}
.lnk:hover{text-decoration-color:var(--brand)}
.sel-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:9px;border:1px solid transparent;font-weight:500;margin-right:-8px}
.sel-btn:hover{background:var(--hover);border-color:var(--line)}
.sel-btn.dirty{background:var(--brand-50);border-color:var(--brand-100)}
.sel-btn>.i{color:var(--ink-3)}
.ver-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.ver-ic.ok{background:var(--success-bg);color:var(--success-ink)}
.ver-ic.no{background:var(--neutral-bg);color:var(--ink-3)}
.ver-l{display:flex;align-items:center;gap:10px}
.w-total{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
.w-total b{font-size:28px;font-weight:600;letter-spacing:-.02em}
.asset{display:flex;align-items:center;gap:12px;height:58px;border-bottom:1px solid var(--line-soft)}
.asset:last-child{border-bottom:0}
.asset-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.asset .an{flex:1}
.asset .an div:last-child,.asset .aa div:last-child{font-size:12.5px;color:var(--ink-2)}
.asset .aa{text-align:right}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{aspect-ratio:1.586;border-radius:16px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 140% at 100% 0%,#2C2C2C 0%,#111 60%);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.pcard.alt{background:radial-gradient(120% 140% at 100% 0%,#FF9A4D 0%,#FC7C1A 45%,#E0600A 100%)}
.pcard .pc-top{display:flex;justify-content:space-between;align-items:center}
.pcard .pc-no{font-size:16px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.pcard .pc-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;opacity:.85}
.pcard .pc-st{font-family:var(--font);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;background:rgba(255,255,255,.16);padding:3px 7px;border-radius:6px}
.lim{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.lim:last-child{border-bottom:0}
.lim-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:10px}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ink)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:8px 0 12px}
.tl-i .tl-dot{position:absolute;left:-26px;top:8px;width:21px;height:21px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.tl-i .tl-t{font-weight:500;font-size:13.5px}
.tl-i .tl-s{font-size:12.5px;color:var(--ink-2)}

/* ───────────────────────── Popover / tooltip / toast / modal ───────────────────────── */
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);min-width:220px;padding:6px;display:none;animation:pop-in .12s ease}
.pop.open{display:block}
.pop-head{display:flex;align-items:center;gap:6px;height:34px;padding:0 4px;font-weight:600;font-size:13px;margin-bottom:2px}
.pop-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;margin:-6px -6px 6px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.pop-head+.pop-search{margin-top:0;border-top:1px solid var(--line)}
.pop-search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink);font-size:13.5px}
.pop-list{max-height:300px;overflow-y:auto}
.pi{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;width:100%;font-size:13.5px;white-space:nowrap}
.pi:hover,.pi.kb{background:var(--hover)}
.pi>.i{color:var(--ink-3)}
.pi .pl{flex:1;overflow:hidden;text-overflow:ellipsis}
.pi .pc{color:var(--ink-3);font-size:11.5px}
.pi .chk{margin-left:auto;color:var(--ink)}
.pi.danger{color:var(--error-ink)} .pi.danger>.i{color:var(--error)}
.pop-sep{height:1px;background:var(--line);margin:6px -6px}
.pop-sec{padding:8px 6px 4px}
.pop-sec+.pop-sec{border-top:1px solid var(--line);margin-top:4px}
.pop-lbl{font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;display:flex;justify-content:space-between}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:12px;height:34px}
.pop-row>span{color:var(--ink-2);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-strong);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}

.tt{position:fixed;z-index:80;pointer-events:none;background:var(--float);color:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow-pop);opacity:0;transition:opacity .1s;min-width:120px}
.tt.show{opacity:1}
.tt.plain{min-width:0;padding:6px 9px;font-weight:500}
.tt .tt-d{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.55);margin-bottom:5px}
.tt .tt-r{display:flex;align-items:center;gap:8px;justify-content:space-between;line-height:1.7}
.tt .tt-r span:first-child{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.75)}
.tt .sw{width:8px;height:8px;border-radius:2px;display:inline-block}

.toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:9px;background:var(--float);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-pop);animation:toast-in .2s cubic-bezier(.2,.8,.2,1)}
.toast .i{color:var(--brand)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

.modal-wrap{position:fixed;inset:0;z-index:75;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,10,10,.28);backdrop-filter:blur(2px)}
.modal-wrap.open{display:flex}
.modal{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-pop);animation:pop-in .16s ease;overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px;font-weight:600;font-size:16px}
.modal-b{padding:10px 20px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--head-bg)}
.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.field input,.field select{width:100%;height:40px;border-radius:10px;border:1px solid var(--line-strong);padding:0 12px;outline:0;background:var(--surface)}
.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}

/* ───────────────────────── Dashboard ───────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:22px 24px 18px;border-right:1px solid var(--line);min-width:0}
.kpi:last-of-type{border-right:0}
.kpi-l{font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
.kpi-v{font-size:26px;font-weight:600;letter-spacing:-.025em;margin-top:10px;line-height:1.1;white-space:nowrap}
.kpi-f{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:10px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;padding:2px 6px 2px 4px;border-radius:6px;white-space:nowrap}
.delta.up{color:var(--success-ink);background:var(--success-bg)}
.delta.down{color:var(--error-ink);background:var(--error-bg)}
.spark{width:86px;height:30px;flex:none}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding:24px 28px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);min-width:0}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;min-height:28px}
.card-t{font-weight:600;font-size:14px;letter-spacing:-.01em}
.card-tag{font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
.big{display:flex;align-items:baseline;gap:10px;margin:-4px 0 14px}
.big b{font-size:30px;font-weight:600;letter-spacing:-.03em}
.legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:14px;height:2px;border-radius:2px;background:var(--c1)}
.lg-dash{width:14px;height:0;border-top:2px dashed var(--ink-3)}
.chart-card{display:flex;flex-direction:column}
.chart{position:relative;flex:1 1 0;min-height:200px}
.chart svg{position:absolute;inset:0}
.chart svg{display:block;overflow:visible}
.ax{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.funnel-r{padding:7px 0}
.funnel-h{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:8px}
.funnel-h>span:first-child{flex:1}
.funnel-h b{font-weight:500;font-variant-numeric:tabular-nums}
.funnel-h .fpct{color:var(--ink-3);font-size:12px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.fbar{height:8px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.fbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--brand)}
.stack{display:flex;gap:2px;height:28px;border-radius:7px;overflow:hidden;margin:4px 0 16px}
.stack i{display:block;height:100%;transition:opacity .12s}
.stack i:first-child{border-radius:6px 0 0 6px}.stack i:last-child{border-radius:0 6px 6px 0}
.stack:hover i{opacity:.55} .stack i:hover{opacity:1}
.lrows .lr{display:flex;align-items:center;gap:10px;height:36px;font-size:13px;border-bottom:1px solid var(--line-soft)}
.lrows .lr:last-child{border-bottom:0}
.lr .sw,.legend .sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.lr .lr-l{flex:1;color:var(--ink)}
.lr .lr-v{font-family:var(--mono);font-size:12.5px}
.lr .lr-p{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:40px;text-align:right}
.barlist .bl{position:relative;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-bottom:6px;font-size:13px;border-radius:8px}
.barlist .bl i{position:absolute;left:0;top:0;bottom:0;background:var(--brand-100);border-radius:8px;z-index:0}
.barlist .bl>span{position:relative;z-index:1;display:flex;align-items:center;gap:8px}
.barlist .bl:hover i{background:var(--brand-200)}
.rk{display:flex;align-items:center;gap:12px;height:56px;border-bottom:1px solid var(--line-soft);width:100%}
.rk:last-child{border-bottom:0}
.rk:hover .rk-go{color:var(--ink);transform:translateX(2px)}
.rk-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--tone-bg);color:var(--tone-ink);flex:none}
.rk-l{flex:1;font-size:13.5px}
.rk-l div:last-child{font-size:12px;color:var(--ink-2)}
.rk-v{font-family:var(--mono);font-size:15px;font-weight:500}
.rk-go{color:var(--ink-3);transition:transform .12s,color .12s}
.res{padding:9px 0}
.res-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}
.res-h .rn{display:flex;align-items:center;gap:8px;font-weight:500}
.res .meter{height:6px;overflow:visible}
.res .meter.under i{background:var(--warning)}
.res .meter .par{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--surface);box-shadow:0 0 0 1px var(--ink-3);border-radius:1px;z-index:1}
.su{display:flex;align-items:center;gap:10px;height:52px;border-bottom:1px solid var(--line-soft);cursor:pointer;margin:0 -8px;padding:0 8px;border-radius:10px}
.su:hover{background:var(--row-hover)}
.su:last-child{border-bottom:0}
.su .sm{flex:1;min-width:0}
.su .sm div:first-child{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su .sm div:last-child{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ms{background:var(--surface-2);border-radius:12px;padding:12px}
.ms .kpi-l{font-size:10px}
.ms b{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.ph{display:grid;place-items:center;min-height:calc(100vh - 72px - 140px)}

/* ───────────────────────── Responsive ───────────────────────── */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-of-type(3){border-right:0}
  .kpi:nth-of-type(n+4){border-top:1px solid var(--line)}
  .ustats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span-8,.span-4,.span-6{grid-column:span 12}
  .up-grid{grid-template-columns:minmax(0,1fr)}
  .lmeta .hide-md{display:none}
}
@media (max-width:900px){
  .app.collapsed .sb-label{max-height:44px;padding:18px 13px 6px}
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar,.app.collapsed .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-pop)}
  .app.mobile-open .sidebar{transform:none}
  .app.collapsed .fade{opacity:1;pointer-events:auto}
  .sb-toggle,.app.collapsed .sb-toggle{display:none}
  .menu-btn{display:grid}
  .topbar{padding:0 16px;gap:10px}
  .tb-hide-sm,.tb-lbl{display:none}
  .topbar .btn{padding:0 11px}
  .page-head,.toolbar,.tabs{padding-left:16px;padding-right:16px}
  .results{padding:0 16px 24px}
  .dgrid,.up-grid{padding:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:1px solid var(--line)!important;border-top:1px solid var(--line)}
  .kpi:nth-of-type(-n+2){border-top:0}
  .kpi:nth-of-type(2n){border-right:0!important}
  .ustats{display:flex;overflow-x:auto;scrollbar-width:none;padding:12px 16px 2px}
  .ust{flex:0 0 150px}
  .search{width:100%}
  .seg button .sl,.tool-btn .sl{display:none}
  .lmeta{gap:10px}.lmeta .hide-sm{display:none}
  .tscroll{max-height:none}
  .kv2{grid-template-columns:1fr}
  .kv2 .kv-r:nth-last-child(2):nth-child(odd){border-bottom:1px solid var(--line-soft)}
}
</style>
</head>

function genUsers(n) {
  const out = []; let t = NOW.getTime() - 9 * 6e4;
  const cw = Object.fromEntries(Object.entries(COUNTRIES).map(([k, c]) => [k, c.w]));
  for (let i = 0; i < n; i++) {
    const id = 27828 - i;
    const kyc = i === 1 || i === 4 ? 'new' : wpick({ approved: 54, new: 18, pending: 11, review: 8, rejected: 5 });
    const named = kyc !== 'new' || R() < .25;
    const fn = pick(FIRST), ln = pick(LAST);
    const email = named ? `${slug(fn)}${R() < .5 ? '.' : ''}${slug(ln)}${R() < .4 ? Math.floor(R() * 99) : ''}@${pick(DOMAINS)}` : `${pick(['user', 'hello', 'mail', 'crypto', 'pay', 'me'])}${slug(pick(FIRST))}${Math.floor(R() * 999)}@${pick(DOMAINS)}`;
    const country = named ? wpick(cw) : null;
    const risk = kyc === 'approved' ? wpick({ low: 62, medium: 24, high: 7, unknown: 7 }) : kyc === 'rejected' ? wpick({ high: 50, medium: 30, unknown: 20 }) : wpick({ unknown: 80, low: 12, medium: 8 });
    const status = kyc === 'rejected' && R() < .5 ? 'blocked' : wpick({ active: 86, inactive: 10, blocked: 4 });
    const level = kyc === 'approved' ? wpick({ basic: 40, middle: 42, premium: 18 }) : wpick({ basic: 60, middle: 40 });
    const balance = kyc === 'approved' ? Math.round(Math.pow(R(), 2.4) * 52000 + R() * 400) : (kyc !== 'new' && R() < .3 ? Math.round(R() * 900) : 0);
    const created = new Date(t);
    out.push({
      id, uid: hex(6), name: named ? `${fn} ${ln}` : '', email, country, status, kyc, risk, level,
      type: R() < .12 ? 'company' : 'individual',
      company: R() < .8 ? COMPANIES[0] : pick(COMPANIES.slice(1)),
      balance, cards: kyc === 'approved' ? wpick({ 0: 15, 1: 55, 2: 24, 3: 6 }) * 1 : 0,
      twofa: R() < (kyc === 'approved' ? .7 : .25), emailVerified: kyc !== 'new' || R() < .45, idv: kyc === 'approved',
      lang: (country && LANGS[country]) || 'EN', referral: hex(12).toLowerCase(),
      invitedBy: R() < .2 ? 27828 - Math.floor(n + R() * 2000) : null,
      created, updated: new Date(Math.min(NOW.getTime(), created.getTime() + R() * 9 * 864e5)),

}

function genSeries(dates, base, seed, unit) {

  const d = { dates, unit: P.unit };
  for (const [k, M] of Object.entries(METRICS)) {

    d[k] = { cur: genSeries(dates, M.base * mult, s, P.unit), prev: genSeries(dates, M.base * mult * .91, s + 11, P.unit) };

}

const deltaPill = (v, unit = '%') => `<span class="delta ${v >= 0 ? 'up' : 'down'}">${icon(v >= 0 ? 'arrowUR' : 'arrowDR', 12, 2)}${Math.abs(v).toFixed(1)}${unit}</span>`;

}

function niceMax(m) { const p = Math.pow(10, Math.floor(Math.log10(m))); const f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function smoothPath(pts) {

  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2, t = .18;
    d += `C${(p1[0] + (p2[0] - p0[0]) * t).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) * t).toFixed(1)},${(p2[0] - (p3[0] - p1[0]) * t).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) * t).toFixed(1)},${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function drawMainChart(d) {
  const el = $('#mainChart'); if (!el) return;
  S._dash = d;
  const M = METRICS[S.metric], cur = d[S.metric].cur, prev = d[S.metric].prev, n = cur.length;
  const W = el.clientWidth, H = el.clientHeight || 220, pl = 52, pr = 10, pt = 10, pb = 28;
  const max = niceMax(Math.max(...cur, ...prev) * 1.05);

  const P = cur.map((v, i) => [x(i), y(v)]), Q = prev.map((v, i) => [x(i), y(v)]);
  const lbl = dt => d.unit === 'month' ? dt.toLocaleDateString('en-GB', { month: 'short' }) : dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const step = Math.max(1, Math.ceil(n / 6));

  'sel-clear': () => { S.selected.clear(); closePop(); renderResults(); renderFloat(); },
  'page': a => { S.page = +a.dataset.p; renderResults(); $('.tscroll') && ($('.tscroll').scrollTop = 0); },
  'perpage': a => openPop(a, menuItems([25, 50, 100].map(n => ({ act: 'set-perpage', data: { n }, label: n, on: S.perPage === n }))), { width: 120 }),
  'set-perpage': a => { S.perPage = +a.dataset.n; S.page = 1; closePop(); renderResults(); },
  'toggle-group': a => { const g = a.dataset.g; S.collapsed.has(g) ? S.collapsed.delete(g) : S.collapsed.add(g); a.closest('.lg').classList.toggle('collapsed'); },
  'more': a => { const g = a.dataset.g; S.more[g] = (S.more[g] || (S.view === 'board' ? 25 : 30)) + 50; renderResults(); },

  'copy': a => { try { navigator.clipboard.writeText(a.dataset.copy); } catch {} closePop(); toast('Copied to clipboard', 'copy'); },
  'impersonate': a => { closePop(); const u = byId(+a.dataset.id); toast(`Opening session as ${esc(u.name || u.email)}`, 'login'); },
  'row-more': a => { const u = byId(+a.dataset.id); openPop(a, menuItems([{ act: 'open-user', data: { id: u.id }, icon: 'user', label: 'Open profile' }, { act: 'impersonate', data: { id: u.id }, icon: 'login', label: 'Login as user' }, { act: 'copy', data: { copy: u.email }, icon: 'mail', label: 'Copy email' }, { act: 'copy', data: { copy: u.uid }, icon: 'hash', label: 'Copy unique ID' }, '-', { act: 'toggle-block', data: { id: u.id }, icon: 'ban', label: u.status === 'blocked' ? 'Unblock' : 'Block user', cls: u.status === 'blocked' ? '' : 'danger' }]), { align: 'right', width: 210 }); },
  'open-user': (a, e) => { closePop(); goUser(+a.dataset.id, e); },
  'toggle-block': a => { closePop(); const u = byId(+a.dataset.id); u.status = u.status === 'blocked' ? 'active' : 'blocked'; u.updated = NOW; delete S.draft.status; toast(`${esc(u.name || u.email)} ${u.status === 'blocked' ? 'blocked' : 'unblocked'}`, u.status === 'blocked' ? 'ban' : 'check'); afterDataChange(); },

  'bulk-set': a => { const f = a.dataset.field, opts = { status: STATUS, level: LEVEL, risk: RISK }[f]; openPop(a, `<div class="pop-head" style="padding-left:10px">Set ${f}</div>` + menuItems(Object.entries(opts).map(([k, o]) => ({ act: 'apply-bulk', data: { field: f, v: k }, html: `<span class="pl" style="display:flex;align-items:center;gap:8px"><i class="dot t-${o.tone}"></i>${o.label}</span>` }))), { width: 200 }); },
  'apply-bulk': a => { const { field, v } = a.dataset; S.selected.forEach(id => { const u = byId(id); u[field] = v; u.updated = NOW; }); closePop(); toast(`Updated ${S.selected.size} users`); afterDataChange(); },
  'bulk-export': () => exportCSV(USERS.filter(u => S.selected.has(u.id)), 'users-selected'),
  'bulk-block': () => { S.selected.forEach(id => byId(id).status = 'blocked'); toast(`Blocked ${S.selected.size} users`, 'ban'); S.selected.clear(); afterDataChange(); },
  'export': () => exportCSV(S._list.length ? S._list : USERS),

  'u-step': a => stepUser(+a.dataset.d),
  'u-tab': a => { S.userTab = a.dataset.v; renderUserPage(); },
  'u-select': a => {
    const f = a.dataset.field, opts = { status: STATUS, level: LEVEL, risk: RISK, country: ctryOpts }[f], u = byId(S.userId), cur = (f in S.draft ? S.draft[f] : u[f]) || 'none';
    openPop(a, `<div class="pop-list">${Object.entries(opts).map(([k, o]) => `<button class="pi" data-act="set-draft" data-field="${f}" data-v="${k}">${o.flag ? `<span class="flag">${o.flag}</span>` : f === 'risk' ? riskIcon(k) : `<i class="dot t-${o.tone || 'neutral'}"></i>`}<span class="pl">${o.label}</span>${k === cur ? `<span class="chk">${icon('check', 15, 2)}</span>` : ''}</button>`).join('')}</div>`, { align: 'right', width: 220 });
  },
  'set-draft': a => { const { field, v } = a.dataset, u = byId(S.userId), val = field === 'country' && v === 'none' ? null : v; if (u[field] === val) delete S.draft[field]; else S.draft[field] = val; closePop(); renderUserPage(); },
  'u-discard': () => { S.draft = {}; renderUserPage(); },
  'u-save': () => { const u = byId(S.userId); Object.assign(u, S.draft); u.updated = NOW; S.draft = {}; toast('Changes saved'); renderUserPage(); },
  'u-more': a => { const u = byId(S.userId); openPop(a, menuItems([{ act: 'toast', data: { msg: 'Password reset link sent' }, icon: 'key', label: 'Send password reset' }, { act: 'reset-2fa', data: { id: u.id }, icon: 'lock', label: 'Reset 2FA' }, { act: 'copy', data: { copy: u.email }, icon: 'mail', label: 'Copy email' }, { act: 'export-one', data: { id: u.id }, icon: 'download', label: 'Export data' }]), { align: 'right', width: 220 }); },
  'export-one': a => { closePop(); exportCSV([byId(+a.dataset.id)], 'user-' + a.dataset.id); },
  'reset-2fa': a => { closePop(); const u = byId(+a.dataset.id); u.twofa = false; delete S.draft.twofa; toast('2FA reset — user will re-enroll at next sign-in', 'lock'); afterDataChange(); },

  'new-user': newUserModal,
  'nu-type': a => { $$('#nuType button').forEach(b => b.classList.toggle('on', b === a)); },
  'create-user': () => {
    const email = $('#nuEmail').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { $('#nuEmail').style.borderColor = 'var(--error)'; $('#nuEmail').focus(); return; }
    const id = Math.max(...USERS.map(u => u.id)) + 1;
    USERS.unshift({ id, uid: hex(6), name: '', email, country: null, status: 'active', kyc: 'new', risk: 'unknown', level: 'basic', type: $('#nuType .on').dataset.v, company: $('#nuCompany').value, balance: 0, cards: 0, twofa: false, emailVerified: false, idv: false, lang: 'EN', referral: hex(12).toLowerCase(), invitedBy: null, created: new Date(NOW), updated: new Date(NOW) });
    closeModal(); toast('User created — invite sent', 'mail'); goUser(id);
  },
  'modal-close': closeModal,
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) { e.preventDefault(); ACT[a.dataset.act] && ACT[a.dataset.act](a, e); return; }
  const r = e.target.closest('[data-uid]');
  if (r && !e.target.closest('.pop')) goUser(+r.dataset.uid, e);
  if (e.target.closest('.nav') && innerWidth <= 900) $('#app').classList.remove('mobile-open');
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'uSearch') { S.search = t.value; S.page = 1; renderStats(); renderResults(); renderFloat(); }
  else if (t.id === 'popQ') $('#popFields').innerHTML = fieldItems(t.value);
  else if (t.id === 'popVQ') $('#popVals').innerHTML = valueItems(t.dataset.key, t.value);
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); return; }
  if (e.key === 'Enter' && e.target.id === 'popQ') { const b = $('#popFields .pi[data-key]'); b && b.click(); }
  if (e.key === 'Enter' && e.target.id === 'nuEmail') ACT['create-user']();
  if (e.key === 'Escape') {
    if (pop.classList.contains('open')) closePop();
    else if (modal.classList.contains('open')) closeModal();
    else if (typing) document.activeElement.blur();
    else if (S.route === 'users' && S.userId) location.hash = '#/users';
    else if (S.selected.size) ACT['sel-clear']();
    return;
  }
  if (typing || mod) return;
  if (e.key === '[') toggleSidebar();
  if (e.key === '/' && S.route === 'users' && !S.userId) { e.preventDefault(); $('#uSearch').focus(); }
  if (S.userId && e.key === 'j') stepUser(1);
  if (S.userId && e.key === 'k') stepUser(-1);
});

/* board drag & drop */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.bcard'); if (!c) return; dragId = +c.dataset.uid; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragend', e => { e.target.closest?.('.bcard')?.classList.remove('dragging'); $$('.col.over').forEach(c => c.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col'); if (!col || dragId == null) return; e.preventDefault(); $$('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => {
  const col = e.target.closest?.('.col'); if (!col || dragId == null) return; e.preventDefault();
  const u = byId(dragId), f = col.dataset.field, v = col.dataset.col; dragId = null;
  if (u[f] !== v) { u[f] = v; u.updated = NOW; toast(`${esc(u.name || u.email)} → ${FIELDS[f].options[v].label}`); afterDataChange(); }
  else col.classList.remove('over');
});

/* ════════════════════════════ Boot ════════════════════════════ */
if (store.get('nsc.sidebar', 'open') === 'collapsed') $('#app').classList.add('collapsed');
route();
</script>
</body>
</html>
