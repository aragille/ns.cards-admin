<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NS.Cards Admin</title>
<!--
  NS.Cards Admin: clickable prototype
  Icons: Solar "Linear" by 480 Design, CC BY 4.0 (SOLAR in <script>)
  ─────────────────────────────────────
  • Design tokens       → :root (light) and :root[data-theme="dark"] in <style>
  • Logo / favicon      → BRANDS in <script> (NS.Cards, Entry, Lemon Finance; picked in Prototype config)
  • Navigation          → NAV
  • Mock data           → genUsers(), dashData()
  • Users stat widgets  → STAT_TILES
  • Users table columns → COLS
  • Filter fields       → FIELDS
  • Companies           → genCompanies(), CARD_PRODUCTS / IBAN_PRODUCTS, cd() for per-company tabs
  • Other list pages    → page({...}) configs in PAGES (one template: tiles, filters, Display, record page)
  • Dashboard pages     → DASHES (Finance monitors, Reserves, Operation / Wallet statistics)
  Routes: #/dashboard, #/users/<id>, #/companies[/access|/<id>], #/<page>, #/<page>/<id> for every PAGES entry
  Shortcuts: ⌘K command menu · ⌘B / [ toggle sidebar · "/" focus search · j / k next/prev user · Esc back/close
-->
<script>
  try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('nsc.theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  catch (e) { document.documentElement.dataset.theme = 'light'; }
  try { document.documentElement.dataset.brand = JSON.parse(localStorage.getItem('nsc.brand')) || 'ns'; } catch (e) {}
</script>
<link rel="icon" id="favicon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── Tokens ───────────────────────── */
:root{
  color-scheme:light;
  /* Design-system tokens live in ds/tokens.css (generated from Figma). Only prototype-only values stay here. */
  --on-brand:var(--on-color);  /* text on brand fills; white-label brands override it */
  --brand-edge:transparent;    /* white-label: thin edge on light brand fills */
  --card-alt:linear-gradient(135deg,#FF9A4D,#E0600A); --card-alt-ink:#FFFFFF;  /* mini card illustration */
  --asset-eur:#111111;         /* EUR asset colour in data */
}
:root[data-theme="dark"],[data-theme="dark"]{
  color-scheme:dark;
  --asset-eur:#3A3A40;
}
/* White-label brands (Prototype config → Product). NS.Cards is the default above; light accents get dark ink and darker strokes */
:root[data-brand="entry"]{--brand:#C2FB50; --focus:#C2FB50; --brand-hover:#B4EF3A; --brand-ink:#4A7300; --on-brand:#111111; --brand-edge:rgba(0,0,0,.06);
  --brand-subtle:#EDFCCF; --highlight:#E0FAAE; --card-alt:linear-gradient(135deg,#D6FD84,#B2EC34); --card-alt-ink:#111111}
:root[data-brand="lemon"]{--brand:#FFF357; --focus:#FFF357; --brand-hover:#F7E93A; --brand-ink:#6E6200; --on-brand:#111111; --brand-edge:rgba(0,0,0,.08);
  --brand-subtle:#FFF9C4; --highlight:#FFF39A; --card-alt:linear-gradient(135deg,#FFF784,#F4E500); --card-alt-ink:#111111}
:root[data-theme="dark"][data-brand="entry"],:root[data-brand="entry"] [data-theme="dark"]{--brand-hover:#D2FC7A; --brand-ink:#C2FB50; --brand-edge:transparent;
  --brand-subtle:rgba(194,251,80,.15); --highlight:rgba(194,251,80,.36)}
:root[data-theme="dark"][data-brand="lemon"],:root[data-brand="lemon"] [data-theme="dark"]{--brand-hover:#FFF77F; --brand-ink:#FFF357; --brand-edge:transparent;
  --brand-subtle:rgba(255,243,87,.15); --highlight:rgba(255,243,87,.36)}

/* ───────────────────────── Base ───────────────────────── */
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:var(--r-sm);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--line-strong)}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:var(--fs-14);line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","tnum"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.i{flex:none;display:block}
.mono{font-family:var(--font);font-size:var(--fs-12);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.r{text-align:right}
::selection{background:var(--brand-subtle)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-xs)}

/* ───────────────────────── Shell ───────────────────────── */
/* Sidebar animates its own width; icons sit at fixed x so nothing jumps, labels only fade. */
.app{display:grid;grid-template-columns:auto minmax(0,1fr);height:100vh}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:var(--border-width) solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:20;transition:width .24s cubic-bezier(.2,.8,.2,1)}
.app.collapsed .sidebar{width:var(--sidebar-collapsed)}
/* every moving part shares the width's duration and curve; labels fade out at once and back in a beat late, so text never shows while it is being cut */
.fade{transition:opacity .16s ease .06s}
.app.collapsed .fade{opacity:0;pointer-events:none;transition-delay:0s}
.app.sb-anim .sidebar .nav>span,.app.sb-anim .me .em{text-overflow:clip} /* no ellipsis flicker mid-animation */
/* header rows: 12px above and below the 36px controls; the sidebar logo shares the topbar's 30px line */
.sb-head{position:relative;height:var(--topbar);display:flex;align-items:center;padding:0 var(--space-24) 0 var(--space-12);flex:none}
.logo{display:flex;align-items:center;gap:5.6px;color:var(--ink);transition:opacity .15s}
/* the logo's mark sits centred in a 40px slot 12 in, exactly like the nav squares below, so mark, icons, toggle and avatar share one axis (x 32) open and collapsed.
   --mark-w: the width of the mark that stays when collapsed, set per logo in renderSidebar */
.sb-head .logo{margin-left:calc(var(--control-lg) / 2 - var(--mark-w) / 2)}
.lg-full{display:inline-flex;align-items:center}
.lg-entry{gap:var(--space-8);margin-left:calc(-1 * var(--space-2))} .lg-lemon{position:relative}
.lg-lemon .lm-mark{position:absolute;left:1px;opacity:0;transition:opacity .16s ease} .app.collapsed .lg-lemon .lm-mark{opacity:1}
.lm-mark path,.lm-fruit{fill:currentColor} :root[data-theme="dark"] .lm-mark path,:root[data-theme="dark"] .lm-fruit{fill:#FFF357}
/* custom logo (Profile settings → Branding): open it shows the logo, collapsed the 20px icon centred where the open logo's mark is (x 32), cross-fading so nothing moves */
.lg-img{display:block;height:24px;max-width:180px;object-fit:contain;object-position:left center}
.lg-img.auth{height:36px;max-width:260px;margin:0 auto}
.lg-cust{position:relative;display:flex;align-items:center;min-height:24px}
.lg-c-full{display:flex;align-items:center;transition:opacity .16s ease .06s}
.lg-c-icon{position:absolute;left:calc(var(--mark-w) / 2 - 10px);top:50%;width:20px;height:20px;margin-top:-10px;border-radius:var(--r-inner);object-fit:cover;opacity:0;transition:opacity .16s ease}
img.crop{object-fit:cover;object-position:left center}
.app.collapsed .lg-c-full{opacity:0;transition-delay:0s}
.app.collapsed .lg-c-icon{opacity:1;transition-delay:.06s}
.sb-toggle{position:absolute;right:var(--space-16);top:calc((var(--topbar) - var(--control-md)) / 2);width:var(--control-md);height:var(--control-md);border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);transition:opacity .15s,right .24s cubic-bezier(.2,.8,.2,1)}
.sb-toggle:hover{background:var(--hover);color:var(--ink)}
.sb-toggle{opacity:0} .sb-head:hover .sb-toggle,.sb-toggle:focus-visible{opacity:1}
/* the toggle sits on the logo's centre line; collapsed it centres on the rail's icon column (x 32), like the nav squares and the avatar below it */
.app.collapsed .sb-toggle{right:calc(var(--sidebar-collapsed) - var(--border-width) - var(--space-12) - var(--control-lg) / 2 - var(--control-md) / 2);opacity:0;pointer-events:none}
.app.collapsed .sb-head:hover .sb-toggle{opacity:1;pointer-events:auto}
.app.collapsed .sb-head:hover .logo{opacity:0}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--space-8) var(--space-12) var(--space-12);transition:padding-right .24s cubic-bezier(.2,.8,.2,1)}
/* collapsing, items keep their left edge (so icons and dots never move) and narrow with the sidebar into 40px squares: only the right padding eases 12 → 15 */
.app.collapsed .sb-scroll{padding-right:calc(var(--sidebar-collapsed) - var(--border-width) - var(--space-12) - var(--control-lg))}
.nav{display:flex;align-items:center;gap:var(--space-12);height:var(--control-lg);padding:0 var(--space-12);border-radius:var(--r);color:var(--ink-2);font-size:var(--fs-14);line-height:var(--lh-20);font-weight:var(--fw-medium);width:100%;white-space:nowrap;overflow:hidden;transition:background .12s}
.nav:hover{background:var(--hover)}
.nav .i{color:var(--ink-3)}
.nav.active,.nav.active:hover{background:var(--selected);color:var(--ink)}
/* section labels: small all-caps titles; collapsed, the title fades and a short rule takes its place at the same height, so no icon moves up or down */
.sb-label{display:flex;align-items:center;gap:var(--space-8);width:100%;font-size:var(--fs-12);line-height:var(--lh-16);font-weight:var(--fw-medium);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:var(--space-16) var(--space-12) var(--space-8);white-space:nowrap;
  overflow:hidden;transition:opacity .16s ease .06s}
.sb-sec{position:relative}
.sb-sec::before{content:'';position:absolute;left:var(--space-12);top:calc(var(--space-16) + var(--space-8));width:var(--icon-md);height:var(--border-width);background:var(--line-strong);opacity:0;transition:opacity .16s ease;pointer-events:none} /* the rail's section rule: icon-wide, on the icons' x, at the title's mid-line */
.app.collapsed .sb-sec::before{opacity:1;transition-delay:.06s}
.app.collapsed .sb-sec.closed:has(.sb-dot)::before{background:var(--brand)} /* folded section with something pending */
/* sections fold from their title: the chevron shows on hover and stays (turned) while folded; a folded section with pending items gets a small brand dot */
.sb-label .i{margin-left:auto;opacity:0;transition:opacity .12s,transform .15s}
.sb-label:hover{color:var(--ink-2)} .sb-label:hover .i{opacity:1}
.sb-dot{display:none;width:6px;height:6px;border-radius:var(--pill);background:var(--brand);flex:none}
.sb-sec.closed .sb-label .i{transform:rotate(-90deg);opacity:1}
.sb-sec.closed .sb-dot{display:block}
/* folding slides the items' height (0fr ↔ 1fr) instead of popping them; the inner box clips, widened 4px so focus rings aren't cut */
.sb-items{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s cubic-bezier(.2,.8,.2,1)}
.sb-items>div{min-height:0;overflow:hidden;margin:0 calc(-1 * var(--space-4));padding:0 var(--space-4)}
.sb-sec.closed .sb-items{grid-template-rows:0fr} /* stays folded in the rail too, so nothing below shifts */
.sb-scroll>.nav{margin-bottom:var(--space-2)}
.nav.active .i{color:var(--ink)}
/* attention dot: something on that page waits on an admin; on the icon's corner while the sidebar is collapsed */
.nav{position:relative}
.ndot{width:6px;height:6px;border-radius:var(--pill);background:var(--brand);margin-left:auto;flex:none;transition:opacity .16s ease .06s}
/* the corner dot always sits on the icon's corner and cross-fades with the in-row dot/badge, so nothing changes place */
.ndot-c{position:absolute;left:var(--space-24);top:calc(var(--space-8) + var(--space-2));margin:0;box-shadow:0 0 0 2px var(--surface);opacity:0;transition-delay:0s}
.app.collapsed .sidebar .ndot-c{opacity:1;transition-delay:.06s}
.app.collapsed .sidebar .ndot:not(.ndot-c){opacity:0;transition-delay:0s}
.sb-foot .me-av{margin-left:var(--space-4)} /* centred on the icons' axis (x 32) in both states, so it never moves */
.nav>span{min-width:0;overflow:hidden;text-overflow:ellipsis} /* long labels truncate so the count badge always shows */
.nav .nb{margin-left:auto;font-family:var(--font);font-size:var(--fs-12);line-height:var(--lh-16);font-weight:var(--fw-medium);font-style:normal;display:inline-flex;align-items:center;justify-content:center;height:var(--control-xs);min-width:var(--control-xs);color:var(--brand-ink);background:var(--brand-subtle);padding:0 var(--space-4);border-radius:var(--r-xs);flex:none;transition:opacity .16s ease .06s}
.app.collapsed .sidebar .nb{opacity:0;transition-delay:0s}
/* flyout variant: one row per section, its pages open in a panel beside the sidebar */
.v-fly>.nav,.v-tabs>.nav{margin-bottom:var(--space-2)}
.topbar.sec{height:auto;padding-top:var(--space-12);flex-direction:column;align-items:stretch;gap:0}
.tb-row{height:var(--control-lg);display:flex;align-items:center;gap:var(--space-8)} /* title row, then 4px, then the tabs */
.tb-title{margin:0;font-size:var(--fs-16);line-height:var(--lh-24);font-weight:var(--fw-semibold);color:var(--ink);white-space:nowrap}
.topbar .tb-tabs{padding:0;margin:var(--space-4) 0 calc(-1 * var(--border-width)) calc(-1 * var(--space-8));height:var(--control-lg);flex:none;position:relative;z-index:1} /* the selected tab's line sits on the topbar's bottom line (Topbar → Section: 96) */
.tb-tabs .tab{height:100%}
.nav-fly{text-align:left}
.nav-fly .nf-chev{margin-left:auto;display:flex;color:var(--ink-3)}
.nav-fly .ndot+.nf-chev{margin-left:var(--space-8)}
.nav-fly.open{background:var(--hover)}
.nav-fly.active.open{background:var(--selected)}
.fly-h{padding:var(--space-8) var(--space-12);font-size:var(--fs-12);line-height:var(--lh-16);font-weight:var(--fw-medium);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.pop .nav{height:var(--control-md)}
.pi .pv{color:var(--ink-3);font-size:var(--fs-14)}
.pi .pv+.i{color:var(--ink-3)}
.sb-foot{padding:var(--space-8);border-top:var(--border-width) solid var(--line);flex:none}
.me{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-4);border-radius:var(--r);width:100%;white-space:nowrap;overflow:hidden}
.me:hover{background:var(--hover)}
.me-more{color:var(--ink-3)} .me:hover .me-more{color:var(--ink-2)}
.me .em{font-size:var(--fs-14);line-height:var(--lh-20);overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
/* Avatar (Sidebar → Account): 32 round, bg/surface-2, initials in Label/Small, text/secondary — same in the sidebar and the profile menu */
.me-av{width:var(--avatar-md);height:var(--avatar-md);border-radius:var(--pill);background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none;font-size:var(--fs-12);line-height:var(--lh-16);font-weight:var(--fw-medium);letter-spacing:0}
.me-h{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-8) var(--space-8) var(--space-8) var(--space-12)}
.me-h .me-n{font-weight:500;font-size:var(--fs-14)}
.me-h .me-e{font-size:var(--fs-12);color:var(--ink-3)}
.me-h .me-n,.me-h .me-e{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.ic button{width:var(--control-md);padding:0;justify-content:center}
.pop-row.me-theme{gap:var(--space-8);height:var(--control-md);padding:0 var(--space-8)}
.pop-row.me-theme>.i{color:var(--ink-2);flex:none}
.pop-row.me-theme>span{flex:1;color:var(--ink)}

.main-wrap{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:var(--topbar);flex:none;display:flex;align-items:center;gap:var(--space-8);padding:0 var(--page-padding);border-bottom:var(--border-width) solid var(--line);background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:var(--space-8);font-size:var(--fs-16);line-height:var(--lh-24);flex:0 1 auto;overflow:hidden;padding:var(--space-4) var(--space-8);margin:0 calc(-1 * var(--space-8));color:var(--ink-2);min-width:0;white-space:nowrap}
.crumbs a{padding:var(--space-4) var(--space-8);margin:0 calc(-1 * var(--space-8));border-radius:var(--r-sm)}
.crumbs a:focus-visible{outline:0;background:var(--surface);box-shadow:var(--focus-brand)}
.crumbs a:hover{background:var(--hover);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:var(--fw-semibold);overflow:hidden;text-overflow:ellipsis}
.crumb-sep{color:var(--ink-disabled)}
.tb-ctx{display:flex;align-items:center;gap:var(--space-8)}
.tb-div{width:var(--border-width);height:var(--control-xs);background:var(--line);flex:none} /* 8 to the buttons on both sides (the actions gap) */
.crumbs .count{font-family:var(--font);font-size:var(--fs-12);line-height:var(--lh-16);color:var(--ink-3)}
.topbar .vsep{margin:0 var(--space-4)}
kbd{font-family:var(--font);font-size:var(--fs-12);line-height:var(--lh-16);font-weight:var(--fw-medium);display:inline-flex;align-items:center;justify-content:center;height:var(--control-xs);min-width:var(--control-xs);color:var(--ink-2);background:var(--surface-2);border:var(--border-width) solid var(--line);border-radius:var(--r-xs);padding:0 var(--space-4)}
.tb-sp{flex:1}
/* Buttons — DS «Button» / «Icon button». Medium 32 (pages), .btn-lg 40 (overlays). */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-8);height:var(--control-md);padding:0 var(--space-16);border-radius:var(--r-sm);border:var(--border-width) solid transparent;background:transparent;color:var(--ink);font-family:var(--font);font-size:var(--fs-14);line-height:var(--lh-20);font-weight:var(--fw-medium);white-space:nowrap;cursor:pointer;transition:background .12s,box-shadow .12s,border-color .12s,color .12s}
.btn-lg{border-radius:var(--r);height:var(--control-lg);padding:0 var(--space-16)}
.btn:focus-visible{outline:0;box-shadow:var(--focus-brand)}
.btn-primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand-edge)}
.btn-primary:hover{background:var(--brand-hover)} .btn-primary:active{background:var(--brand-pressed)}
.btn-secondary{background:var(--inv);color:var(--on-inv)}
.btn-secondary:hover{background:var(--inv-hover)} .btn-secondary:active{background:var(--inv-pressed)}
.btn-tertiary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-tertiary:hover{background:var(--hover)} .btn-tertiary:active{background:var(--selected)}
/* Link (Figma Button → Variant=Link): text only — no padding, no fill in any state; text/secondary, text/primary on hover and press */
.btn.btn-link,.topbar .btn.btn-link{padding:0;background:transparent;color:var(--ink-2)}
.btn-link:hover,.btn-link:active{color:var(--ink)}
.btn-danger{background:var(--error);color:var(--on-color)}
.btn-danger:hover{background:var(--status-error-hover)} .btn-danger:active{background:var(--status-error-pressed)} .btn-danger:focus-visible{box-shadow:var(--focus-error)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--surface-2);color:var(--ink-disabled);border-color:transparent;cursor:not-allowed;box-shadow:none}
.btn-tertiary:disabled,.btn-tertiary[aria-disabled="true"]{border-color:var(--line)}
.btn-link:disabled,.btn-link[aria-disabled="true"]{background:transparent}
.icon-btn{width:var(--control-md);height:var(--control-md);display:grid;place-items:center;flex:none;position:relative;border-radius:var(--r-sm);border:var(--border-width) solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .12s,box-shadow .12s}
.icon-btn:hover:not(:disabled){background:var(--hover)} .icon-btn:active:not(:disabled){background:var(--selected)}
.icon-btn:focus-visible{outline:0;box-shadow:var(--focus-brand)}
.icon-btn:disabled{background:var(--surface-2);border-color:var(--line);color:var(--ink-disabled);cursor:not-allowed}
.icon-btn-link{border-color:transparent;background:transparent;color:var(--ink-2)}
/* Icon button → Link: no fill at rest; bg/hover on hover and focus, bg/selected when pressed */
.icon-btn-link:hover:not(:disabled),.icon-btn-link:focus-visible{background:var(--hover);color:var(--ink)} .icon-btn-link:active:not(:disabled){background:var(--selected);color:var(--ink)}
.icon-btn-link:disabled{background:transparent;border-color:transparent}
.auth .field label .btn-link{height:auto;padding:0;font-size:var(--fs-12);font-weight:var(--fw-regular);color:var(--ink-2)}
.pa-ph .btn-link{height:auto;padding:0;font-size:var(--fs-12);letter-spacing:0;text-transform:none}
.icon-btn .dotn{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:var(--r-sm);background:var(--brand);color:var(--on-brand);font-size:var(--fs-12);font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.menu-btn{display:none}
main{flex:1;overflow:auto;min-height:0}
.keys{display:flex;flex-direction:column}
.keys>div{display:flex;align-items:center;justify-content:space-between;height:40px;border-bottom:var(--border-width) solid var(--line-soft);font-size:var(--fs-14)}
.keys>div:last-child{border-bottom:0}
.keys span:last-child{display:flex;gap:var(--space-4)}

/* Framed page with hairlines */
.page{min-height:100%;background:var(--bg)}
.band{position:relative;border-bottom:var(--border-width) solid var(--line)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-16);padding:var(--space-32) var(--page-padding) var(--space-24);flex-wrap:wrap}
h1{font-size:var(--fs-24);line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:0;display:flex;align-items:baseline;gap:var(--space-12)}
h1 .count{font-family:var(--font);font-size:var(--fs-14);font-weight:400;color:var(--ink-3);letter-spacing:0}

.fdd{display:inline-flex;align-items:center;gap:var(--space-8);height:var(--control-md);padding:0 var(--space-8) 0 var(--space-12);border:var(--border-width) solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:var(--fs-14);line-height:var(--lh-20);font-weight:var(--fw-regular);color:var(--ink-3);white-space:nowrap;flex:none;transition:border-color .12s,box-shadow .12s}

.fdd>span{max-width:280px;overflow:hidden;text-overflow:ellipsis} .toolbar.fv-inline .search,.toolbar.is-empty{display:none} .toolbar #addFilter[hidden]{display:none} /* In columns: no Filter button */

.search{display:flex;align-items:center;gap:var(--space-8);height:var(--control-md);padding:0 var(--space-8) 0 var(--space-12);width:300px;border-radius:var(--r-sm);background:var(--surface);border:var(--border-width) solid var(--line);color:var(--ink-3);transition:border-color .12s,box-shadow .12s}
.search:hover{border-color:var(--line-strong)} .search:focus-within{border-color:var(--focus);box-shadow:var(--focus-brand)}

@media (min-width:901px){
  .page.fit{height:100%;min-height:560px;display:flex;flex-direction:column}

}

.frow th{top:var(--row);padding:var(--space-4) var(--space-8);font-weight:var(--fw-regular);cursor:default}

.fsel-c{padding-right:var(--space-8)} .fsel-c.on{color:var(--ink)}

.fsel-c>.i{flex:none;color:var(--ink-3)}

.fclr{width:var(--control-xs);height:var(--control-xs);display:grid;place-items:center;border-radius:var(--r-xs);color:var(--ink-3)} .fclr:hover{background:var(--selected);color:var(--ink)} /* clear all: same 20px box as the row checkboxes above it */
.frow-empty td{height:auto;padding:var(--space-24) var(--space-16)!important;color:var(--ink-2);font-size:var(--fs-14)} .frow-empty td>*{position:sticky;left:var(--space-16)}

.compact .ucell .ue{display:none}

  --rowbg:var(--hover);background:linear-gradient(to right,transparent,var(--rowbg) 32px)}

  box-shadow:var(--shadow-lg)}

.pop-search{position:relative;display:flex;align-items:center;gap:var(--space-8);height:var(--control-md);padding:0 var(--space-12);margin:0 calc(-1 * var(--space-4)) calc(var(--space-8) + var(--border-width));color:var(--ink-3)}

.modal-h{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);padding:var(--space-16) var(--space-16) var(--space-8) var(--space-24);font-weight:var(--fw-semibold);font-size:var(--fs-16);line-height:var(--lh-24)}

.chart-card{display:flex;flex-direction:column}

.ax{font-family:var(--font);font-size:var(--fs-12);fill:var(--ink-3)}
.stack{display:flex;gap:var(--space-2);height:28px;border-radius:var(--r-xs);overflow:hidden;margin:var(--space-4) 0 var(--space-16)}

.stack i:first-child{border-radius:var(--r-xs) 0 0 var(--r-xs)}.stack i:last-child{border-radius:0 var(--r-xs) var(--r-xs) 0}
.stack:hover i{opacity:.55} .stack i:hover{opacity:1}
.lrows .lr{display:flex;align-items:center;gap:var(--space-12);height:36px;font-size:var(--fs-14);border-bottom:var(--border-width) solid var(--line-soft)}

.lr .lr-v{font-family:var(--font);font-size:var(--fs-12)}
.lr .lr-p{font-family:var(--font);font-size:var(--fs-12);color:var(--ink-3);width:40px;text-align:right}
.barlist .bl{position:relative;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-12);margin-bottom:var(--space-8);font-size:var(--fs-14);border-radius:var(--r-sm)}

.rk-l{flex:1;font-size:var(--fs-14)}
.rk-l div:last-child{font-size:var(--fs-12);color:var(--ink-2)}
.rk-v{font-family:var(--font);font-size:var(--fs-16);font-weight:500}
.rk-go{color:var(--ink-3);transition:transform .12s,color .12s}
.res{padding:var(--space-8) 0}
/* Overview */
.ov-stat{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-12) var(--space-16)!important;color:inherit}
.ov-stat>.i{margin-left:auto;color:var(--ink-3)}
.ov-stat:hover>.i{color:var(--ink)}
.os-ic{width:var(--control-md);height:var(--control-md);border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface-2);color:var(--ink);flex:none}
.os-l{display:flex;flex-direction:column;gap:var(--space-4);font-size:var(--fs-12);line-height:var(--lh-16);font-weight:var(--fw-medium);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.os-l b{font-size:var(--fs-20);line-height:var(--lh-24);font-weight:var(--fw-semibold);color:var(--ink);letter-spacing:-.02em;text-transform:none;font-variant-numeric:tabular-nums}
 /* beats .dgrid .card.flush>.card-h: title centred in the header bar */
.ovr{display:grid;grid-template-columns:var(--avatar-sm) minmax(0,1fr) auto var(--icon-md);align-items:center;gap:var(--space-8);width:100%;height:var(--row);padding:0;border-bottom:var(--border-width) solid var(--line-soft);text-align:left;font-size:var(--fs-14)}
.ovr:last-child{border-bottom:0}
.ovr{position:relative;isolation:isolate}
.ovr:hover::before{content:'';position:absolute;inset:0 calc(-1 * var(--space-8));z-index:-1;background:var(--hover);border-radius:var(--r-sm)} /* hover bleeds 8 past the text, the divider stays on the content line */
.ovr .os-ic{width:var(--avatar-sm);height:var(--avatar-sm);border-radius:var(--r-sm)}
.ovr-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovr-n{justify-self:end;font-family:var(--font);font-size:var(--fs-12);line-height:var(--lh-16);font-weight:var(--fw-medium);color:var(--brand-ink);background:var(--brand-subtle);padding:var(--space-2) var(--space-4);min-width:var(--control-xs);text-align:center;border-radius:var(--r-xs)} /* Counter → Attention */
.ovr.clear .ovr-n{font-family:var(--font);font-weight:400;color:var(--ink-3);background:none;padding:0}
.ovr>.i{color:var(--ink-3)}
.ovr:hover>.i{color:var(--ink)}
.ovw{display:flex;align-items:center;justify-content:space-between;height:var(--row);padding:0;border-bottom:var(--border-width) solid var(--line-soft)}
.ovw:last-child{border-bottom:0}
.ovw b{font-size:var(--fs-14);font-weight:var(--fw-medium)}

.ovl{display:grid;grid-template-columns:96px 160px minmax(0,1fr) auto;gap:var(--space-12);align-items:center;height:var(--row);padding:0;border-bottom:var(--border-width) solid var(--line-soft);font-size:var(--fs-14)}
.ovl:last-child{border-bottom:0}
.card.ov>.ovr,.card.ov>.ovw,.card.ov>.ovl{width:calc(100% - 2 * var(--card-padding));margin:0 var(--card-padding)}
.card.ov>.card-h+*{margin-top:var(--space-4)}
.card.ov>:last-child{margin-bottom:var(--space-8)}
.ovl-a{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* finance monitors: headroom bar (threshold mark in the middle) and the per-kind dashboard cards */
.mon-m{display:inline-flex;align-items:center;gap:var(--space-8)}
.mon-m .meter{width:72px;overflow:visible}
.mon-m .meter b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--surface);box-shadow:0 0 0 var(--border-width) var(--ink-3);border-radius:1px}
.mon-m .num{width:40px;text-align:right;font-size:var(--fs-12);color:var(--ink-2)}
.mon-d{font-size:var(--fs-14);color:var(--ink-2);margin:calc(-1 * var(--space-8)) 0 var(--space-16)}
.mon-sum{display:flex;gap:var(--space-32);margin-bottom:var(--space-12)}
.mon-sum span{display:block;font-size:var(--fs-12);color:var(--ink-3);margin-bottom:var(--space-2)}
.mon-sum b{font-family:var(--font);font-size:var(--fs-20);font-weight:500}
.mon-sum b.bad{color:var(--error)}
.mon-row{display:flex;align-items:center;gap:var(--space-12);height:var(--row);border-top:var(--border-width) solid var(--line-soft);font-size:var(--fs-14)}

.res-v{display:inline-flex;align-items:center;gap:var(--space-8)}
.res .meter .par{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--surface);box-shadow:0 0 0 var(--border-width) var(--ink-3);border-radius:1px;z-index:1}
.su{display:grid;grid-template-columns:minmax(0,1fr) auto var(--icon-md);align-items:center;gap:var(--space-8);height:var(--row);border-bottom:var(--border-width) solid var(--line-soft);cursor:pointer;font-size:var(--fs-14)}
.dgrid .card:not(.ov-stat):not(.flush)>.card-h+.su{margin-top:var(--space-4)} .dgrid .card:not(.ov-stat):not(.flush)>.su:last-child{margin-bottom:var(--space-8)} /* Card → Body with List rows: 4 · rows · 8 */
.su.su-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto var(--icon-md);column-gap:var(--space-12)} /* List row → Activity without time: name · product · amount; in a narrow card name and product share the width */
.su-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-3 .su-n{font-weight:var(--fw-medium)}
.su-m{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su>.i,.mon-row>.i:last-child{color:var(--ink-3)} .su:hover>.i,.mon-row:hover>.i:last-child{color:var(--ink)}
.su,.mon-row{position:relative;isolation:isolate}
.su:hover::before,.mon-row:hover::before{content:'';position:absolute;inset:0 calc(-1 * var(--space-8));z-index:-1;background:var(--hover);border-radius:var(--r-sm)}
.su:last-child{border-bottom:0}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-8);margin-top:var(--space-16)}
.ms{background:var(--surface-2);border-radius:var(--r);padding:var(--space-12)}
.ms .kpi-l{font-size:var(--fs-12)}
.ms b{display:block;font-size:var(--fs-16);font-weight:600;letter-spacing:-.02em;margin-top:var(--space-8)}
.ph{display:grid;place-items:center;min-height:calc(100vh - 61px - 140px)}

/* ───────────────────────── Companies ───────────────────────── */
.src{display:inline-flex;align-items:center;height:22px;padding:0 var(--space-8);border-radius:var(--r-xs);border:var(--border-width) solid var(--line);background:var(--surface);font-size:var(--fs-12);font-weight:600;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap}
.pchips{display:inline-flex;gap:var(--space-8)}
.pchips .tag .i{color:var(--ink-3)}
.sw-t{position:relative;display:inline-block;width:var(--control-md);height:var(--control-xs);border-radius:var(--pill);background:var(--line-strong);transition:background .15s;flex:none;vertical-align:middle}
.sw-t::after{content:"";position:absolute;top:var(--space-2);left:var(--space-2);width:var(--icon-md);height:var(--icon-md);border-radius:var(--pill);background:var(--on-color);box-shadow:var(--shadow-sm);transition:transform .15s,background .15s}
.sw-t.on{background:var(--inv)} .sw-t.on::after{transform:translateX(12px);background:var(--on-inv)}
.sw-t.dis{background:var(--surface-2)} .sw-t.dis::after{background:var(--line-strong);box-shadow:none}
.btn .cb{width:14px;height:14px;border-radius:var(--r-xs)}
.su-step{display:flex;align-items:center;gap:var(--space-12);width:100%;height:42px;border-bottom:var(--border-width) solid var(--line-soft);font-size:var(--fs-14);color:var(--ink)}

.su-step .pl{flex:1}
.su-step>.i{color:var(--ink-3);transition:transform .12s}
.su-step:hover>.i{color:var(--ink);transform:translateX(2px)}
.su-step.done .pl{color:var(--ink-2)}
.inp.w{width:100%}
.inp.dirty,.fsel.dirty{border-color:var(--brand-subtle);background-color:var(--brand-subtle)}
.hint .warn{color:var(--warning-ink)} .hint .ok{color:var(--success-ink)}
.modal-wrap{overflow-y:auto}
.tools-sep{width:1px;height:22px;background:var(--line);margin:0 var(--space-4)}
.key-box{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-12);border-radius:var(--r);background:var(--surface-2);border:var(--border-width) solid var(--line);font-family:var(--font);font-size:var(--fs-12);word-break:break-all}
.key-box .copy{margin:0}
/* Product access: companies on the left are navigation, the open company's products as switches on the right */
.page.fit .results.pa{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:var(--grid-gap)}
.pa>.tcard{display:flex;flex-direction:column;min-height:0}
@media (max-width:900px){.pa{display:grid;gap:var(--space-16)}.pa-list,.pa-body{max-height:70vh}}
.pa-h{display:flex;align-items:center;gap:var(--space-12);height:44px;padding:0 var(--space-16) 0 var(--space-16);border-bottom:var(--border-width) solid var(--line);background:var(--hover);font-size:var(--fs-12);font-weight:500;color:var(--ink-2);flex:none}
.pa-n{margin-left:auto;font-family:var(--font);font-size:var(--fs-12);font-weight:400;color:var(--ink-3)}
.pa-list,.pa-body{flex:1;min-height:0;overflow:auto}
.pa-co{display:flex;align-items:center;gap:var(--space-12);height:40px;padding:0 var(--space-16) 0 var(--space-16);border-bottom:var(--border-width) solid var(--line-soft);cursor:pointer}
.pa-co:hover{background:var(--hover)}
.pa-co.on,.pa-co.on:hover{background:var(--hover)}
.pa-cn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pa-co .code{flex:none}
.pa-end{margin-left:auto;display:flex;align-items:center;gap:var(--space-8);flex:none}
.pa-cnt{display:inline-grid;place-items:center;min-width:22px;height:18px;padding:0 var(--space-8);border-radius:var(--r-xs);background:var(--surface-2);font-family:var(--font);font-size:var(--fs-12);color:var(--ink-2)}

.pa-tools{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-12) var(--space-16) var(--space-12) var(--space-24);border-bottom:var(--border-width) solid var(--line);flex:none}
.pa-tools .search{flex:1;max-width:320px;height:var(--control-md)}
.pa-t{display:flex;align-items:baseline;gap:var(--space-8);min-width:0;font-size:var(--fs-16);font-weight:600;overflow:hidden}
.pa-t .lnk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa-ts{font-size:var(--fs-12);font-weight:400;color:var(--ink-3);white-space:nowrap}
.pa-gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--space-8);height:44px;padding:0 var(--space-24);background:var(--hover);border-bottom:var(--border-width) solid var(--line);font-weight:600}
.pa-gh .i{color:var(--ink-3)}
.pa-gh .pa-n{margin-right:var(--space-8)}
.pa-ph{display:flex;align-items:center;justify-content:space-between;height:38px;padding:var(--space-8) var(--space-24) 0;font-size:var(--fs-12);font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
.pa-p{display:flex;align-items:center;gap:var(--space-12);height:52px;margin:0 var(--space-8);padding:0 var(--space-12);border-radius:var(--r-sm);cursor:pointer}
.pa-p:hover{background:var(--hover)}

.pa-pn{min-width:0;flex:1}

.pa-g{padding-bottom:var(--space-12)}
  /* group switch: some of its products are on */
/* branding */
.br-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--space-16);align-items:start}
.br-main{display:flex;flex-direction:column;gap:var(--grid-gap);min-width:0}

.bf-r{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:center;gap:var(--space-16);min-height:58px;padding:var(--space-8) 0;border-bottom:var(--border-width) solid var(--line-soft)}
.bf-r:last-child{border-bottom:0}
.bf-r>label{font-size:var(--fs-14);color:var(--ink-2)}
.bf-r .inp{height:var(--control-lg);border-radius:var(--r)} /* branding form: Large controls (40 → radius 12) */
.clr{display:flex;align-items:center;gap:var(--space-8)}
.clr input[type=color]{width:var(--control-lg);height:var(--control-lg);padding:var(--space-4);border-radius:var(--r);border:var(--border-width) solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.clr input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.clr input[type=color]::-webkit-color-swatch{border:0;border-radius:var(--r-xs)}
.clr .inp:not(.w){width:120px;font-variant-numeric:tabular-nums;text-transform:uppercase}
/* brand preview: shows the partner's own colours, so it does not follow the admin theme */
.bp{--bp-ink:#111;border-radius:var(--r-lg);overflow:hidden;background:var(--bp-bg);color:var(--bp-ink);border:var(--border-width) solid var(--line);font-size:var(--fs-14)}
.bp-top{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-16) var(--space-16) var(--space-12);font-weight:600}
.bp-logo{width:28px;height:28px;border-radius:var(--r-sm);background:var(--bp-c);color:var(--bp-t);display:grid;place-items:center;font-size:var(--fs-12);font-weight:600;overflow:hidden;flex:none}
.bp-logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.bp-top .bp-me{margin-left:auto;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--bp-ink) 10%,transparent)}
.bp-card{margin:0 var(--space-16);border-radius:var(--r-lg);padding:var(--space-16);background:linear-gradient(135deg,var(--bp-c),color-mix(in srgb,var(--bp-c) 72%,#000));color:var(--bp-t)}
.bp-card .l{font-size:var(--fs-12);opacity:.8}
.bp-card .v{font-size:var(--fs-24);font-weight:600;letter-spacing:-.02em;margin:var(--space-4) 0 var(--space-16)}

.bp-row{display:flex;align-items:center;gap:var(--space-12);height:42px;border-bottom:var(--border-width) solid color-mix(in srgb,var(--bp-ink) 8%,transparent)}
.bp-row:last-of-type{border-bottom:0}
.bp-row i{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--bp-c) 14%,transparent);flex:none}
.bp-row span{flex:1} .bp-row b{font-weight:500}
.bp-btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8);margin-top:var(--space-12)}
.bp-btn{height:40px;border-radius:var(--pill);background:var(--bp-c);color:var(--bp-t);display:grid;place-items:center;font-weight:600}
.bp-btn.alt{background:color-mix(in srgb,var(--bp-ink) 7%,transparent);color:var(--bp-ink)}

.bp-cap{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-12);color:var(--ink-3);margin-top:var(--space-12)}
/* Profile settings (#/settings) */
.st-side{position:sticky;top:var(--page-padding)}
.bf-r>label .bf-sub{display:block;margin-top:var(--space-2);font-size:var(--fs-12);line-height:var(--lh-16);color:var(--ink-3)}

.bf-r .inp.bad{border-color:var(--error)} .bf-r .inp.bad:focus{box-shadow:var(--focus-error)}

.st-th{height:var(--control-lg);min-width:96px;max-width:180px;padding:0 var(--space-12);border-radius:var(--r);border:var(--border-width) solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.st-th.light{background:#FFFFFF;color:#111111} .st-th.dark{background:#191918;color:#F5F5F4} /* fixed: the logo is checked against both sidebars whatever the current theme */
.st-th img{display:block;max-height:24px;max-width:156px}
.st-th.ic{min-width:0;width:var(--control-lg);padding:0;background:var(--surface-2)}
.st-th.ic img{width:24px;height:24px;border-radius:var(--r-inner);object-fit:contain} .st-th.ic img.crop{object-fit:cover}
.st-th .fade,.sp .fade{opacity:1!important} /* product logos inside thumbnails stay whole when the sidebar is collapsed */
/* preview: a slice of the admin in the current theme, with the draft's accent */
.sp{display:flex;flex-direction:column;gap:var(--space-12)}
.sp-app{display:grid;grid-template-columns:minmax(0,1fr) 56px;border:var(--border-width) solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.sp-side{background:var(--surface);border-right:var(--border-width) solid var(--line);padding:0 var(--space-8) var(--space-8);min-width:0}
.sp-logo{height:48px;display:flex;align-items:center;padding:0 var(--space-12);overflow:hidden}
.sp-logo .lg-img{height:20px;max-width:100%}
.sp .nav{height:var(--control-md);cursor:default}
.sp-rail{background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:var(--space-4);padding-bottom:var(--space-8)}
.sp-mark{height:48px;display:grid;place-items:center}
.sp-mark img,.sp-fav img{width:20px;height:20px;border-radius:var(--r-inner);object-fit:contain;display:block} .sp-mark img.crop,.sp-fav img.crop{object-fit:cover}
.sp-ri{position:relative;width:var(--control-md);height:var(--control-md);border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-3)}
.sp-ri.on{background:var(--selected);color:var(--ink)}
.sp-ri .ndot{position:absolute;right:6px;top:6px;margin:0;box-shadow:0 0 0 2px var(--selected)}
.sp-ctl{display:flex;align-items:center;gap:var(--space-8)}
.sp-in{flex:1;min-width:0;height:var(--control-md);display:flex;align-items:center;padding:0 var(--space-12);border-radius:var(--r-sm);border:var(--border-width) solid var(--focus);box-shadow:var(--focus-brand);background:var(--surface);color:var(--ink-3);font-size:var(--fs-14);white-space:nowrap;overflow:hidden}
.sp-ctl .btn{pointer-events:none;flex:none}
.sp-tab{display:flex;align-items:center;gap:var(--space-8);height:var(--control-md);padding:0 var(--space-12);border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--surface-2);font-size:var(--fs-12);color:var(--ink-2);width:220px;max-width:100%}
.sp-tab>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-fav img{width:16px;height:16px}
/* exchange fee tiers: grouped two-row header */
.dt.grp thead tr:first-child th{border-bottom:var(--border-width) solid var(--line-soft)}
.dt.grp th.gs,.dt.grp td.gs{border-left:var(--border-width) solid var(--line-soft)}
@media (max-width:1180px){ .br-grid{grid-template-columns:minmax(0,1fr)} .br-side{position:static} }
@media (max-width:900px){
  .bf-r{grid-template-columns:minmax(0,1fr);gap:var(--space-8)}
  .mx th.mx-corner,.mx td.mx-co{width:170px;min-width:170px;max-width:170px}
  .card-tools .search{width:100%!important}
}

/* ───────────────────────── Responsive ───────────────────────── */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ustats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span-8,.span-4,.span-6,.span-3,.span-5,.span-7{grid-column:span 12}
  .up-grid{grid-template-columns:minmax(0,1fr)}
  .lmeta .hide-md{display:none}
}
@media (max-width:640px){
  .dp{flex-direction:column}
  .dp-presets{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:var(--border-width) solid var(--line)}
  .dp-months{flex-direction:column}
  .dp-presets .pi{width:auto;flex:none}
}
@media (max-width:900px){
  .topbar .dp-btn{max-width:150px}
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar,.app.collapsed .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  .app.mobile-open .sidebar{transform:none}
  .app.collapsed .fade{opacity:1;pointer-events:auto}
  .app.collapsed .sidebar .nb,.app.collapsed .sidebar .ndot:not(.ndot-c){opacity:1} .app.collapsed .sidebar .ndot-c{opacity:0}
  .app.collapsed .sb-scroll{padding-right:var(--space-12)} .app.collapsed .sb-sec::before{opacity:0}
  .sb-toggle,.app.collapsed .sb-toggle{display:none}
  .menu-btn{display:grid}
  .topbar{padding:0 var(--page-padding-mobile);gap:var(--space-8)}
  .tb-hide-sm,.tb-lbl{display:none}
  .topbar .btn{padding:0 var(--space-12)}
  .page-head,.toolbar,.tabs{padding-left:var(--page-padding-mobile);padding-right:var(--page-padding-mobile)}
  .results{padding:0 var(--page-padding-mobile) var(--page-padding-mobile)}
  .dgrid,.up-grid{padding:var(--page-padding-mobile)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ustats{display:flex;overflow-x:auto;scrollbar-width:none;margin:var(--page-padding-mobile) var(--page-padding-mobile) 0}
  .ust{flex:0 0 140px}
  .search{width:100%}
  .seg button .sl,.btn .sl{display:none}
  .lmeta{gap:var(--space-12)}.lmeta .hide-sm{display:none}
  .tscroll{max-height:none}
  .kv2{grid-template-columns:1fr}
  .wdet{grid-template-columns:1fr 1fr;padding-left:var(--space-24)}
  .card-tools .inp{width:100%}
  .kv2 .kv-r:nth-last-child(2):nth-child(odd){border-bottom:var(--border-width) solid var(--line-soft)}
}

const METRICS = {

function genSeries(dates, base, seed, unit) {
  const r = rng(seed), n = dates.length, trend = unit === 'month' ? .022 : unit === 'day' ? .003 : 0;

}

/* Transactions — wallet history and aggregated history share filters */
function txFiltered(D) {

function pushTx(u, D, o) {

function adjSubmit() {
  const u = byId(S.userId), D = ud(u), mode = $('#adjMode .on').dataset.v;
  const bad = (sel, msg) => { const el = $(sel); el.style.borderColor = 'var(--error)'; el.focus(); toast(msg, 'alert'); };

/* ════════════════════════════ Inline editing ════════════════════════════
   Record pages (a user, a company, any PAGES record) edit their fields in place: text, number, dropdown, multi-select, date or switch.
   Changes stage in the page's draft and tint the field; the floating bar below saves or discards them together, after every changed field passes its checks.
   Field spec: { t: 'text'|'num'|'sel'|'multi'|'date'|'bool', l?, opts?, none?, num?, ph?, sfx?, up?, req?, min?, valid?(v, r) → message, get?(r), set?(r, v), when?(r), show?(v) } */
const edCtx = () => S.route === 'users' && S.userId ? { r: byId(S.userId), draft: S.draft, spec: U_EDIT, redraw: renderUserPage }
  : S.route === 'companies' && S.coId ? { r: coById(S.coId), draft: S.coDraft, spec: CO_EDIT, redraw: renderCompanyPage }
  : pg()?.edit && S.recId && recOf() ? { r: recOf(), draft: S.pgDraft, spec: pg().edit, redraw: renderRec, P: pg() } : null;
// options come as { key: { label, tone?, flag? } }, { key: 'Label' }, [[key, label]] or [value]; a function gets the record. Default: the page's filter options.
function edOpts(X, k) {
  let o = X.spec[k].opts; if (typeof o === 'function') o = o(X.r); o ||= X.P?.fields[k]?.options || {};
  return Array.isArray(o) ? o.map(x => Array.isArray(x) ? [String(x[0]), { label: x[1] }] : [String(x), { label: String(x) }])
    : Object.entries(o).map(([v, x]) => [v, typeof x === 'string' ? { label: x } : x]);
}
const edGet = (X, k) => { const f = X.spec[k]; return f.get ? f.get(X.r) : X.r[k]; };
const edVal = (X, k) => k in X.draft ? X.draft[k] : edGet(X, k);
const edSame = v => JSON.stringify(Array.isArray(v) ? [...v].sort() : v instanceof Date ? v.getTime() : typeof v === 'string' ? v.trim() || null : v ?? null);
function edSet(X, k, v) { if (edSame(v) === edSame(edGet(X, k))) delete X.draft[k]; else X.draft[k] = v; }
const edLook = o => `${o.flag ? `<span class="flag">${o.flag}</span>` : o.tone ? `<i class="dot t-${o.tone}"></i>` : ''}<span class="ie-v">${esc(o.label)}</span>`;
function edMultiInner(X, k) {
  const on = new Set((edVal(X, k) || []).map(String)), L = edOpts(X, k).filter(([v]) => on.has(v)).map(([, o]) => o.label);
  return `<span class="ie-v ${L.length ? '' : 'faint'}">${L.length ? esc(L.slice(0, 2).join(', ')) + (L.length > 2 ? ` <span class="faint">+${L.length - 2}</span>` : '') : 'None'}</span>${icon('chevsUD', 16)}`;
}
// The control for one field, or null when the spec says this record can't change it (the caller then shows the plain value)
function edField(X, k) {
  const f = X.spec[k]; if (!f || (f.when && !f.when(X.r))) return null;
  const v = edVal(X, k), dirty = k in X.draft ? 'dirty' : '';
  switch (f.t) {
    case 'text': case 'num': return `<span class="ie-box ${dirty}"><input class="ie-in" data-ie="${k}" value="${esc(v ?? '')}" placeholder="${esc(f.ph || 'Empty')}" ${f.t === 'num' ? 'inputmode="decimal"' : ''} autocomplete="off" spellcheck="false" aria-label="${esc(f.l || k)}">${f.sfx ? `<span class="ie-sfx">${f.sfx}</span>` : ''}</span>`;
    case 'sel': { const o = edOpts(X, k).find(([x]) => x === String(v ?? ''));
      return `<button class="sel-btn ${dirty}" data-act="ie-sel" data-ie="${k}">${f.show && v != null ? f.show(v) : o ? edLook(o[1]) : `<span class="faint">${f.none || 'Not set'}</span>`}${icon('chevsUD', 16)}</button>`; }
    case 'multi': return `<button class="sel-btn ${dirty}" data-act="ie-multi" data-ie="${k}">${edMultiInner(X, k)}</button>`;
    case 'date': return `<button class="sel-btn ${dirty}" data-act="ie-date" data-ie="${k}">${icon('calendar', 16)}<span class="ie-v">${v ? fmtDateTime(v) : '<span class="faint">Not set</span>'}</span>${icon('chevsUD', 16)}</button>`;

/* ════════════════════════════ Pages: one template for every other list ════════════════════════════ */
// Every remaining list page is a config in PAGES and renders through one template that mirrors Users / Companies:
// stat tiles as filter shortcuts (operational pages only) · search · Filter button + chips (fx()) · Display popover · fixed,
// resizable columns (colCtx()) · pinned checkbox column · hover row actions · bulk bar · CSV/XLSX export · a record page per row.
// Dashboard-style pages are configs in DASHES and render through one KPI strip + cards template (renderDashPage()).
//
// Page config: { id, noun, nouns, icon, data(), live?, key?(r), search(r), searchPh, fields, tiles, cols, sort?,
//   quick?(r) → {act, icon, tip, data?}, menu?(r) → menuItems, bulk?: [{icon, label, run(rows) → toast}],
//   form?: { create?: false, newLabel?, fields(r|null), save(r|null) → false | true | newRecord },
//   rec: { title(r), sub?(r), badges?(r), acts?(r), sections?(r), side?(r), events?(r) } }
S.pg = {}; S.pgW = {}; S.recId = null; S._pgList = []; S.pgDraft = {};
const PAGES = {}, DASHES = {};
const pg = () => PAGES[S.route];
const pgS = id => S.pg[id] ||= { search: '', filters: [], sort: { ...PAGES[id].sort }, page: 1, sel: new Set() };
const pgW = id => S.pgW[id] ||= store.get('nsc.pgw.' + id, {});
const pgData = P => P.live ? P.data() : (P._d ||= P.data());
const pgKey = (P, r) => String(P.key ? P.key(r) : r.id);
const pgRow = (rid, P = pg()) => pgData(P).find(r => pgKey(P, r) === rid);
const recOf = (P = pg()) => pgRow(S.recId, P);
const goRec = (id, e, P = pg()) => { const url = `#/${P.id}/${encodeURIComponent(id)}`; if (e && (e.metaKey || e.ctrlKey)) window.open(location.pathname + url, '_blank'); else location.hash = url; };
const pgSearchF = (P, l, q) => { q = q.trim().toLowerCase(); return q ? l.filter(r => P.search(r).toLowerCase().includes(q)) : l; };
const pgFx = P => { const st = pgS(P.id); return { F: P.fields, items: pgData(P), get list() { return st.filters; }, set list(v) { st.filters = v; }, search: l => pgSearchF(P, l, st.search), changed: pgFiltersChanged }; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const plainText = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };
function page(P) {
  P.title = navTitle(P.id);

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) { e.preventDefault(); const act = a.dataset.act, c = CONFIRM[act]?.(a); if (c) return askConfirm(c, () => ACT[act](a, e)); ACT[act] && ACT[act](a, e); return; }
  if (e.target.closest('a[href]')) return; // a link inside a row opens itself, not the row
  const rr = e.target.closest('tr[data-rid], .bcard[data-rid]');
  if (rr && PAGES[S.route]) { goRec(rr.dataset.rid, e); return; }
  const r = e.target.closest('[data-uid]');
  if (r && !e.target.closest('.pop')) goUser(+r.dataset.uid, e);
  const rc = e.target.closest('[data-cid]');
  if (rc && !e.target.closest('.pop')) goCo(+rc.dataset.cid, e);
  if (e.target.closest('.nav') && innerWidth <= 900) $('#app').classList.remove('mobile-open');
});

  else if (t.dataset.kyc != null) { const u = byId(S.userId); u.kyc = t.value; u.idv = t.value === 'approved'; u.updated = new Date(NOW); toast(`KYC status set to ${KYC[t.value].label}`); renderUserPage(); }
  else if (t.id === 'docFile' && t.files[0]) uploadDoc(t.files[0]);
  else if (t.id === 'formStatus') { S.formStatus = t.value; renderUserPage(); }
  else if (t.id === 'stLogo' || t.id === 'stIcon') stFile(t);
  else coChange(t);
}
document.addEventListener('change', e => onChange(e.target));
document.addEventListener('input', e => {
  const t = e.target;

  if (t.id === 'ieQ') { edFilterList(t.value); return; }

  else if (t.id === 'popQ') $('#popFields').innerHTML = fieldItems(t.value);
  else if (t.id === 'ddQ') $('#ddList').innerHTML = ddItems(S._dd, t.value);

});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const mod = e.metaKey || e.ctrlKey;
  if (!S.me) { if (e.key === 'Escape') cfm.classList.contains('open') ? closeConfirm() : closeModal(); return; } // the auth screen has no shortcuts
  if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); return; }
  if (e.key === 'Enter' && e.target.id === 'popQ') { const b = $('#popFields .pi[data-key]'); b && b.click(); }
  if (e.key === 'Enter' && (e.target.id === 'dpFrom' || e.target.id === 'dpTo')) ACT['dp-apply']();
  if (e.key === 'Enter' && e.target.id === 'ddQ') { const b = $('#ddList .pi[data-v]'); b && b.click(); }
  if (e.key === 'Enter' && e.target.id === 'nuEmail') ACT['create-user']();
  if (e.target.dataset?.ie && e.key === 'Enter') { e.target.blur(); return; }
  if (e.target.dataset?.ie && e.key === 'Escape') { edRevert(e.target); e.target.blur(); return; }
  if (e.key === 'Enter' && e.target.id === 'ieQ') { const b = $('#ieList .pi:not([hidden])'); b && b.click(); }
  if (e.key === 'Escape') {
    if (cfm.classList.contains('open')) closeConfirm();
    else if (pop.classList.contains('open')) closePop();
    else if (modal.classList.contains('open')) closeModal();
    else if (typing) document.activeElement.blur();
    else if (S.route === 'users' && S.userId) location.hash = '#/users';
    else if (S.route === 'companies' && S.coId) location.hash = '#/companies';
    else if (S.route === 'companies' && S.co.sel.size) ACT['co-sel-clear']();
    else if (PAGES[S.route] && S.recId) location.hash = '#/' + S.route;
    else if (PAGES[S.route] && pgS(S.route).sel.size) ACT['pg-sel-clear']();
    else if (S.selected.size) ACT['sel-clear']();
    return;
  }
  if (typing || mod) return;
  if (e.key === '[') toggleSidebar();
  if (e.key === '/' && S.route === 'users' && !S.userId) { e.preventDefault(); $('#uSearch').focus(); }
  if (S.userId && e.key === 'j') stepUser(1);
  if (S.userId && e.key === 'k') stepUser(-1);
  if (e.key === '/' && S.route === 'companies' && !S.coId) { e.preventDefault(); ($('#coSearch') || $('#mxSearch'))?.focus(); }
  if (S.coId && (e.key === 'j' || e.key === 'k')) stepCo(e.key === 'j' ? 1 : -1);
  if (e.key === '/' && PAGES[S.route] && !S.recId) { e.preventDefault(); $('#pgSearch')?.focus(); }
  if (S.recId && (e.key === 'j' || e.key === 'k')) stepRec(e.key === 'j' ? 1 : -1);
});

    ? usersOrder().map(k => COLS.find(c => c.key === k)).filter(c => !c.lock).map(c => ({ k: c.key, l: c.label, on: !S.hidden.has(c.key) }))

  setTimeout(() => g.remove());
}
const colCells = d => [...d.table.rows].flatMap(row => [...row.cells].filter((c, i, a) => a.length === d.table.tHead.rows[0].cells.length && d.table.tHead.rows[0].cells[i]?.dataset.drag === d.k));
document.addEventListener('dragstart', e => {
  const h = e.target.closest?.('[data-drag]'); if (!h) return;
  colDrag = { t: h.dataset.t, k: h.dataset.drag, w: h.offsetWidth, table: h.tagName === 'TH' ? h.closest('table') : null }; $('#tt').classList.remove('show');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', h.dataset.drag);
  if (colDrag.table) colDragImage(h, e);
  setTimeout(() => { // after the browser has taken the drag image
    if (!colDrag) return;
    if (colDrag.table) colCells(colDrag).forEach(c => c.classList.add('col-origin')); else h.classList.add('col-dragging');
  });
});
document.addEventListener('dragover', e => {
  if (!colDrag) return;
  const d = colDrag;
  if (d.table) { // header drag: move the column live as the pointer crosses other columns
    if (e.target.closest?.('table') !== d.table) return;
    e.preventDefault();
    const cell = e.target.closest('th, td'); if (!cell || cell.classList.contains('col-gap') || cell.parentElement.cells.length !== d.table.tHead.rows[0].cells.length) return;
    const hc = d.table.tHead.rows[0].cells[cell.cellIndex]; if (!hc?.dataset.drag) return;
    const head = [...d.table.tHead.rows[0].cells].filter(c => !c.classList.contains('col-gap')), i = head.indexOf(hc);
    if (openColGap(d, i + (dropAfter(cell, e) ? 1 : 0))) placeColSlot();
    return;
  }
  if (e.target.closest?.('.cchip-slot')) { e.preventDefault(); return; }
  const h = e.target.closest?.('.cchip[data-drag]');
  if (!h || h.dataset.t !== d.t || h.dataset.drag === d.k) { if (slot?.parentNode && e.target.closest?.('.cchips')) e.preventDefault(); return; }
  e.preventDefault(); const after = dropAfter(h, e); // chip drag: open a dashed slot where the chip will land
  slot ||= Object.assign(document.createElement('span'), { className: 'cchip-slot' });
  slot.style.width = d.w + 'px'; slot.dataset.target = h.dataset.drag; slot.dataset.after = after ? '1' : '';
  const ref = after ? h.nextSibling : h; if (slot.parentNode !== h.parentNode || slot.nextSibling !== ref) h.parentNode.insertBefore(slot, ref);
});
document.addEventListener('drop', e => {
  if (!colDrag) return;
  const d = colDrag;
  if (d.table) {
    if (e.target.closest?.('table') !== d.table) return; e.preventDefault();
    if (d.gap != null) { const keys = [...d.table.tHead.rows[0].cells].map(c => c.classList.contains('col-gap') ? d.k : c.dataset.drag === d.k ? null : c.dataset.drag).filter(Boolean); d.done = true; clearColGap(d); setVisibleOrder(d.t, keys); }
    return;
  }
  if (slot?.parentNode && slot.dataset.target) { e.preventDefault(); moveCol(d.t, d.k, slot.dataset.target, !!slot.dataset.after); }
});
document.addEventListener('dragend', () => {
  const d = colDrag; if (!d) return;
  if (d.table) { clearColGap(d); $$('.col-origin').forEach(c => c.classList.remove('col-origin')); }
  slot?.remove(); slot = null; $$('.col-dragging').forEach(x => x.classList.remove('col-dragging')); colDrag = null;
});

/* column resize */
let RS = null;
document.addEventListener('mousedown', e => {
  const h = e.target.closest?.('.col-rs'); if (!h) return;
  e.preventDefault(); e.stopPropagation(); fitColumns();
  const X = colCtx(); RS = { k: h.dataset.rs, t: h.closest('table'), x: e.clientX, w: X.w[h.dataset.rs], W: X.w, key: X.key, h };
  h.classList.add('on'); document.body.classList.add('resizing'); $('#tt').classList.remove('show');
}, true);
document.addEventListener('mousemove', e => { if (!RS) return; RS.W[RS.k] = Math.max(56, Math.round(RS.w + e.clientX - RS.x)); applyColW(RS.t); refreshHints(); });
document.addEventListener('mouseup', () => { if (!RS) return; RS.h.classList.remove('on'); document.body.classList.remove('resizing'); store.set(RS.key, RS.W); S._resized = Date.now(); RS = null; });
document.addEventListener('click', e => { if (S._resized && Date.now() - S._resized < 400) { e.stopPropagation(); e.preventDefault(); S._resized = 0; } }, true); // the click that ends a drag must not sort
document.addEventListener('dblclick', e => { const h = e.target.closest?.('.col-rs'); if (!h) return; const X = colCtx(); delete X.w[h.dataset.rs]; store.set(X.key, X.w); X.redraw(); });

/* horizontal scroll hint: soft blurred fade on the side that has more content */
function updHint(el) {
  const w = el.parentElement; if (!w?.classList.contains('hs-wrap')) return;
  const max = el.scrollWidth - el.clientWidth, pin = el.querySelector('th.pin') || el.querySelector('th.cbcell');
  w.style.setProperty('--hs-l', (pin ? pin.getBoundingClientRect().right - el.getBoundingClientRect().left : 0) + 'px'); // left fade starts where the pinned columns end, so it never blurs them
  w.classList.toggle('hs-r', el.scrollLeft < max - 2); w.classList.toggle('hs-l', el.scrollLeft > 2);
}
const refreshHints = () => $$('.hs').forEach(updHint);
document.addEventListener('scroll', e => { if (e.target.classList?.contains('hs')) updHint(e.target); }, true);
new MutationObserver(refreshHints).observe($('#main'), { childList: true, subtree: true });

/* board drag & drop */
let dragId = null;
let bSlot = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.bcard'); if (!c) return; dragId = +c.dataset.uid; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
  bSlot = Object.assign(document.createElement('div'), { className: 'bslot', textContent: 'Drop here' }); bSlot.style.height = c.offsetHeight + 'px';
  const g = document.body.appendChild(Object.assign(document.createElement('div'), { className: 'col-drag-img bcard-img' })), b = c.getBoundingClientRect();
  g.appendChild(c.cloneNode(true)).style.width = c.offsetWidth + 'px'; e.dataTransfer.setDragImage(g, e.clientX - b.left + 16, e.clientY - b.top + 12); setTimeout(() => g.remove());
  setTimeout(() => c.classList.add('dragging')); }); // after the browser has taken the drag image
document.addEventListener('dragend', e => { e.target.closest?.('.bcard')?.classList.remove('dragging'); bSlot?.remove(); bSlot = null; });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col'); if (!col || dragId == null) return; e.preventDefault();
  const b = col.querySelector('.col-b'), home = b.querySelector(`.bcard[data-uid="${dragId}"]`);
  if (home) { bSlot?.remove(); return; } // over its own column: the trace already marks the place
  if (bSlot.parentNode !== b) b.prepend(bSlot); });
document.addEventListener('dragover', e => { const z = e.target.closest?.('#dropzone'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('#dropzone'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest?.('#dropzone'); if (!z) return; e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer.files[0]; f && uploadDoc(f); });
document.addEventListener('drop', e => {
  const col = e.target.closest?.('.col'); if (!col || dragId == null) return; e.preventDefault();
  const u = byId(dragId), f = col.dataset.field, v = col.dataset.col; dragId = null;
  if (u[f] !== v) { u[f] = v; u.updated = NOW; toast(`${esc(u.name || u.email)} → ${FIELDS[f].options[v].label}`); afterDataChange(); }
  else bSlot?.remove();
});

/* ════════════════════════════ Sign in · Sign up ════════════════════════════
   Prototype: any well-formed email with any password signs in; sign up only asks for a name and an 8+ character password.
   The session (name + email) lives in localStorage, so a reload keeps you signed in until Sign out. */
S.me = store.get('nsc.me', { name: 'Super admin', email: 'super_admin@ns.cards' }) || null;
const nameFromEmail = e => e.split('@')[0].split(/[._-]+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' ') || e;
// Signed out: every address shows the auth screen (the page asked for opens after sign in). Signed in: #/login and #/signup go to Overview.
function authRoute() {
  const h = location.hash.replace(/^#\/?/, '').split('/')[0], auth = h === 'login' || h === 'signup';
  if (S.me) { if (auth) { location.replace('#/dashboard'); return true; } $('#auth').hidden = true; $('#app').hidden = false; return false; }
  if (!auth) { S.authNext = location.hash && location.hash !== '#/' ? location.hash : '#/dashboard'; location.replace('#/login'); return true; }
  closePop(); closeModal(); $('#bulk').classList.remove('show'); $('#app').hidden = true; $('#auth').hidden = false; renderAuth(h === 'signup');
  return true;
}
function renderAuth(up) {
  const f = (id, label, type, ac, ph, extra = '') => `<div class="field"><label for="${id}">${t(label)}${extra}</label>${type === 'password'
    ? `<div class="pw"><input id="${id}" type="password" autocomplete="${ac}" placeholder="${ph}"><button type="button" class="ghost-ic" data-act="au-eye" data-tip="${t('Show password')}" aria-label="${t('Show password')}">${icon('eye', 16)}</button></div>`
    : `<input id="${id}" type="${type}" autocomplete="${ac}" placeholder="${ph}" spellcheck="false">`}</div>`;
  $('#auth').innerHTML = `<div class="auth-box">
    <div class="auth-logo lg-${S.brand}">${authLogo()}</div>
    <div class="auth-card">
      <h1>${t(up ? 'Create an account' : 'Sign in')}</h1>
      <p class="auth-sub">${t(up ? 'Get access to the {b} admin panel' : 'Welcome back to the {b} admin panel').replace('{b}', brand().name)}</p>
      <form id="authForm" data-up="${up ? 1 : ''}" novalidate>
        ${up ? f('auName', 'Full name', 'text', 'name', 'Anna Kowalski') : ''}
        ${f('auEmail', up ? 'Work email' : 'Email', 'email', 'username', 'name@company.com')}
        ${f('auPw', 'Password', 'password', up ? 'new-password' : 'current-password', up ? t('At least 8 characters') : '', up ? '' : `<button type="button" class="btn btn-link" data-act="toast" data-msg="${t('Password reset link sent')}">${t('Forgot password?')}</button>`)}
        <button class="btn btn-primary auth-go" type="submit">${t(up ? 'Create account' : 'Sign in')}</button>
      </form>
    </div>
    <p class="auth-alt">${up ? `${t('Already have an account?')} <a href="#/login">${t('Sign in')}</a>` : `${t('New to the admin panel?')} <a href="#/signup">${t('Create an account')}</a>`}</p>
    <p class="auth-note">${t('Prototype: any email and password work.')}</p>
  </div>`;
  $(up ? '#auName' : '#auEmail').focus();
}
const auBad = (id, msg) => { const fl = $('#' + id).closest('.field'); fl.classList.add('bad'); fl.insertAdjacentHTML('beforeend', `<div class="f-err">${t(msg)}</div>`); };
document.addEventListener('input', e => { const fl = e.target.closest?.('#authForm .field.bad'); if (fl) { fl.classList.remove('bad'); fl.querySelector('.f-err')?.remove(); } });
document.addEventListener('submit', e => {
  const form = e.target; if (form.id !== 'authForm') return; e.preventDefault();
  $$('.field.bad', form).forEach(fl => { fl.classList.remove('bad'); fl.querySelector('.f-err')?.remove(); });
  const up = !!form.dataset.up, name = up ? $('#auName').value.trim() : '', email = $('#auEmail').value.trim().toLowerCase(), pw = $('#auPw').value;
  if (up && !name) auBad('auName', 'Enter your name');
  if (!email) auBad('auEmail', 'Enter your email'); else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) auBad('auEmail', 'Enter a valid email address');
  if (!pw) auBad('auPw', 'Enter your password'); else if (up && pw.length < 8) auBad('auPw', 'Use at least 8 characters');
  const bad = $('.field.bad input', form); if (bad) return bad.focus();
  const btn = $('.auth-go', form); btn.disabled = true; btn.textContent = t(up ? 'Creating account…' : 'Signing in…');
  setTimeout(() => {
    S.me = { name: name || nameFromEmail(email), email }; ME = S.me.name; store.set('nsc.me', S.me);
    const next = S.authNext || '#/dashboard'; S.authNext = null;
    location.hash = next; if (location.hash === next) route(); // same address: hashchange won't fire
    toast(up ? `${t('Account created')} · ${esc(email)}` : `${t('Signed in as')} ${esc(email)}`, up ? 'check' : 'login');
  }, 450);
});

/* ════════════════════════════ Boot ════════════════════════════ */
if (S.me) ME = S.me.name;
$('#pcFab').innerHTML = icon('sliders', 20); $('#pcFab').dataset.tip = 'Prototype config';
if (store.get('nsc.sidebar', 'open') === 'collapsed') $('#app').classList.add('collapsed');
route();
</script>
</body>
